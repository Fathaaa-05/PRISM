<script>
/* Website adapter: gives PRISM the same window.claude interface it has on claude.ai.
   AI calls go to this site's own /api/claude server (which holds the API key); downloads use normal browser downloads. */
(function(){
  const API = "/api/claude";
  const getCode = () => { try { return localStorage.getItem("prism.accessCode") || ""; } catch(e) { return ""; } };
  const setCode = c => { try { localStorage.setItem("prism.accessCode", c); } catch(e) {} };
  async function call(payload, signal, retry){
    const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json", "x-access-code":getCode()}, body:JSON.stringify(payload), signal});
    if (r.status === 401 && retry !== false) {
      const c = window.prompt("Enter the PRISM access code to use the AI:");
      if (c) { setCode(c.trim()); return call(payload, signal, false); }
      throw {code:"not_granted", message:"Access code needed"};
    }
    if (r.status === 401) { setCode(""); throw {code:"not_granted", message:"Wrong access code"}; }
    if (r.status === 429) throw {code:"rate_limited", message:"Rate limited"};
    if (!r.ok) { let m = "", t = ""; try { const j = (await r.json()).error; m = j.message; t = j.type; } catch(e) {} throw {code:t === "no_ai" ? "no_ai" : "unavailable", message:m || ("HTTP " + r.status)}; }
    return r.json();
  }
  /* Which AI answers: Claude or a local Ollama model through this site's server, or PRISM's built-in engine.
     The built-in engine needs no key, no server and no internet, so PRISM's AI always works. */
  let modeP = null;
  const mode = () => modeP || (modeP = fetch("/api/status").then(r => r.ok ? r.json() : {ai:"builtin"}).catch(() => ({ai:"builtin"})).then(s => { window.PRISM_AI = s; showMode(s); return s; }));
  const engine = () => window.PRISM_ENGINE.sample;
  const ML = {en:["Local AI","PRISM built-in engine"], fr:["IA locale","moteur intégré PRISM"], es:["IA local","motor integrado de PRISM"], ar:["ذكاء اصطناعي محلي","محرك PRISM المدمج"], hi:["लोकल AI","PRISM का अंतर्निहित इंजन"], ta:["லோக்கல் AI","PRISM உள்ளமைந்த இயந்திரம்"], ml:["ലോക്കൽ AI","PRISM ബിൽറ്റ്-ഇൻ എഞ്ചിൻ"]};
  const modeText = s => { const m = ML[(typeof LANG !== "undefined" && LANG) || "en"] || ML.en;
    return "AI: " + (s.ai === "claude" ? "Claude" : s.ai === "ollama" ? m[0] + " (" + s.model + ")" : m[1]); };
  function showMode(s){
    const go = () => { const el = document.getElementById("saveState"); if (!el) return;
      let d = document.getElementById("aiMode");
      if (!d) { d = document.createElement("div"); d.id = "aiMode"; d.className = "notr"; d.style.cssText = "font-size:11px;color:var(--fg-3);margin-top:4px"; el.insertAdjacentElement("afterend", d);
        const ls = document.getElementById("langSel"); if (ls) ls.addEventListener("change", () => setTimeout(() => showMode(window.PRISM_AI || {ai:"builtin"}), 50)); }
      d.textContent = modeText(s); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  }
  function fallback(){ modeP = Promise.resolve({ai:"builtin"}); window.PRISM_AI = {ai:"builtin"}; showMode(window.PRISM_AI); }
  async function sample(input, opts){
    const m = await mode();
    if (m.ai === "builtin") return engine()(input, opts);
    // With a local model, commands the built-in engine understands are answered instantly; only other questions go to the model.
    if (m.ai === "ollama") { try { const r = await engine()(input, {...(opts || {}), strict:true}); if (r && r.text != null) return r; } catch(e) {} }
    try { return await serverSample(input, opts); }
    catch(e) { if (e && e.code === "no_ai") { fallback(); return engine()(input, opts); } throw e; }
  }
  async function serverSample(input, opts){
    opts = opts || {};
    const messages = typeof input === "string" ? [{role:"user", content:input}] : input.map(m => ({role:m.role, content:m.content}));
    const tools = (opts.tools || []).map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema || {type:"object", properties:{}}}));
    let text = "", stop = "";
    try {
      for (let round = 0; round < 8; round++) {
        const res = await call({messages, tools}, opts.signal);
        stop = res.stop_reason;
        const part = (res.content || []).filter(b => b.type === "text").map(b => b.text).join("");
        if (part) { text = text ? text + "\n\n" + part : part; if (opts.onText) opts.onText({text, delta:part}); }
        if (stop === "refusal") throw {code:"refused", message:"Claude declined this request.", text};
        if (stop !== "tool_use") break;
        messages.push({role:"assistant", content:res.content});
        const results = [];
        for (const b of res.content.filter(b => b.type === "tool_use")) {
          const tool = (opts.tools || []).find(t => t.name === b.name);
          try {
            if (!tool) throw new Error("Unknown tool " + b.name);
            const out = await tool.execute(b.input || {}, {signal: opts.signal || new AbortController().signal});
            results.push({type:"tool_result", tool_use_id:b.id, content:JSON.stringify(out === undefined ? {ok:true} : out)});
          } catch(e) { results.push({type:"tool_result", tool_use_id:b.id, content:String((e && e.message) || e), is_error:true}); }
        }
        messages.push({role:"user", content:results});
      }
    } catch(e) {
      if (e && e.name === "AbortError") throw {code:"cancelled", message:"Stopped"};
      throw e;
    }
    return {text, truncated: stop === "max_tokens"};
  }
  sample.json = async (input, opts) => {
    // Planning and drafting use the built-in engine unless Claude is connected: instant, and reliable JSON.
    if ((await mode()).ai !== "claude") return engine().json(input, opts);
    try {
      const {text} = await serverSample(input, opts);
      const st = text.search(/[\[{]/), en = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
      if (st < 0 || en < st) throw {code:"bad_json"};
      return JSON.parse(text.slice(st, en + 1));
    } catch(e) {
      // A small local model can return broken JSON; the built-in engine fills in so the build still finishes.
      if (e && (e.code === "no_ai" || e.code === "bad_json" || e instanceof SyntaxError || (window.PRISM_AI || {}).ai === "ollama")) { if (e && e.code === "no_ai") fallback(); return engine().json(input, opts); }
      throw e;
    }
  };
  sample.limits = async () => ({});
  const downloads = { save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }};
  window.claude = { use: async name => name === "sample" ? sample : name === "downloads" ? downloads : null };
  if (/^https?:$/.test(location.protocol)) {
    mode(); // find out which AI and whether team sharing is on
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  } else fallback();
})();
</script>

<style>
/* Layout: fixed left rail of five modules + assistant; work area to the right. Stacks to a top tab strip on phones. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eef1f4; --line:#d9dee5;
  --fg:#12171d; --fg-2:#4f5966; --fg-3:#7a8491;
  --accent:#0e7c74; --accent-ink:#ffffff; --accent-soft:#d9efec;
  --s1:#2a78d6; --s1-soft:#c7dbf5; --ink-tick:#12171d;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --idle:#9aa3ad;
  --paper:#ffffff; --paper-ink:#1b2129; --paper-2:#5b6472; --paper-line:#cfd6df; --paper-head:#0e5f59;
  --f-display:"Unbounded", "Manrope", "Noto Sans Arabic", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Malayalam", system-ui, sans-serif;
  --f-body:"Manrope", "Noto Sans Arabic", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Malayalam", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1316; --surface:#171c21; --surface-2:#1f262c; --line:#2c353e;
  --fg:#eef1f3; --fg-2:#b5bec8; --fg-3:#87919c;
  --accent:#2fb3a7; --accent-ink:#06201d; --accent-soft:#163633;
  --s1:#3987e5; --s1-soft:#22374f; --ink-tick:#eef1f3;
  --idle:#6b7580; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1316; --surface:#171c21; --surface-2:#1f262c; --line:#2c353e;
  --fg:#eef1f3; --fg-2:#b5bec8; --fg-3:#87919c;
  --accent:#2fb3a7; --accent-ink:#06201d; --accent-soft:#163633;
  --s1:#3987e5; --s1-soft:#22374f; --ink-tick:#eef1f3;
  --idle:#6b7580; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}

.note{font-size:12px;color:var(--fg-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:start;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}

table.t td input:hover,table.t td select:hover{border-color:var(--line)}
table.t td input:focus,table.t td select:focus{border-color:var(--accent);background:var(--surface)}
.num{text-align:end;font-variant-numeric:tabular-nums}
.warn-line{color:var(--crit);font-size:12.5px;font-weight:600}
/* docs */
.doc-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.sec-edit{display:flex;flex-direction:column;gap:14px}

.daypick{display:flex;flex-wrap:wrap;gap:6px}.daypick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--surface)}

.drawer-bg{position:fixed;inset:0;background:rgba(10,15,20,.32);z-index:60}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100vw);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.18);z-index:61;overflow:auto;padding:18px 20px 40px}
.drawer-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dgrid>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}.dgrid .lbl{margin:0}
.dsec{font-size:14px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.files{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}.files li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}.files li a,.files li .linkbtn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-add,.time-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.att-add input[type=url]{flex:1;min-width:180px}.time-add input[type=date]{width:150px}.time-add #tmHours{width:80px}.time-add #tmNote{flex:1;min-width:140px}
.act{list-style:none;margin:0;padding:0}.act li{display:grid;grid-template-columns:120px 110px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.act li:last-child{border:0}.act .mono{color:var(--fg-3);font-size:11.5px}
.rem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}.rem-txt{white-space:pre-wrap;font:12px/1.45 var(--f-mono);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:6px 0 0;max-height:140px;overflow:auto}.rem-btns{display:flex;gap:6px;flex-wrap:wrap}.rem-btns a.btn{text-decoration:none}
.mebox{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;flex-wrap:wrap}#meBox>.btn{margin-top:8px}
@media (max-width:700px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.act li{grid-template-columns:1fr;gap:2px}.rem{grid-template-columns:1fr}}
@media (max-width:700px){.board{grid-template-columns:repeat(5,minmax(220px,85vw))}}
html[lang=ar] *,html[lang=hi] *,html[lang=ta] *,html[lang=ml] *{letter-spacing:0!important}
.paper h1{font-size:22px;margin:0 0 4px;color:var(--paper-head);text-wrap:balance}
.paper .subt{color:var(--paper-2);margin:0 0 16px}
.paper h2{font-size:14.5px;color:var(--paper-head);margin:20px 0 6px}
.paper p{margin:0 0 7px;white-space:pre-wrap}
.paper p.hint{color:#8a93a0;font-style:italic}
.paper table{border-collapse:collapse;width:100%;margin:4px 0 10px;font-size:11.5px}
.paper th{background:var(--paper-head);color:#fff;text-align:start;padding:5px 7px;font-weight:700}
.paper td{border:1px solid var(--paper-line);padding:4px 7px}
.paper .pbar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:3px 0;font-size:11px}
.paper .pbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper .pbar .tr{height:9px;background:#e6eaef;border-radius:2px;position:relative}
.paper .pbar .fl{height:100%;background:#2a78d6;border-radius:2px}
.paper .pbar .ex{position:absolute;top:-3px;width:2px;height:15px;background:#1b2129}
/* gantt */
.gantt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);direction:ltr}
.gantt-scroll svg{display:block;direction:ltr}
.chart svg{direction:ltr}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
/* tracking */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--fg-3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--fg-2);font-family:var(--f-body)}
.chart .val{fill:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line)}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:12px;z-index:60;max-width:260px;line-height:1.4}
/* assistant */
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:calc(100vh - 140px);min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.chips button:hover{border-color:var(--accent)}
.msgs{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,92%);padding:10px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12px;color:var(--fg-3);background:transparent;padding:0}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat form textarea{flex:1;min-width:0;resize:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.empty-ai{color:var(--fg-2);font-size:13px;max-width:560px}
.empty-ai h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 6px;color:var(--fg)}
.overview{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.doc-layout{grid-template-columns:minmax(0,1fr)}.paper-wrap{position:static;max-height:none}.overview{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:12px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav .sep,.rail-foot{display:none}
  .projbox{flex-direction:row;align-items:flex-end;flex-wrap:wrap;padding:0}
  .projbox .field{flex:1;min-width:160px}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .paper{padding:20px 16px}
  .paper .pbar{grid-template-columns:90px 1fr 36px}
  .chat{height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

"PRISM reads your tasks, schedule and documents. It can answer questions, explain delays, write document sections, and add or update tasks for you. Try one of the questions above, or type your own.":["يقرأ PRISM مهامك وجدولك ومستنداتك. يمكنه الإجابة عن الأسئلة وشرح التأخيرات وكتابة أقسام المستندات وإضافة المهام أو تحديثها. جرّب أحد الأسئلة أعلاه أو اكتب سؤالك.","PRISM आपके कार्य, शेड्यूल और दस्तावेज़ पढ़ता है। यह सवालों के जवाब दे सकता है, देरी समझा सकता है, दस्तावेज़ के हिस्से लिख सकता है और कार्य जोड़ या अपडेट कर सकता है। ऊपर का कोई सवाल आज़माएँ या अपना लिखें।","PRISM உங்கள் பணிகள், அட்டவணை, ஆவணங்களைப் படிக்கிறது. கேள்விகளுக்குப் பதில் அளிக்கும், தாமதங்களை விளக்கும், ஆவணப் பகுதிகளை எழுதும், பணிகளைச் சேர்க்கும் அல்லது புதுப்பிக்கும். மேலே உள்ள கேள்வியை முயற்சிக்கவும் அல்லது உங்கள் கேள்வியை எழுதவும்.","PRISM നിങ്ങളുടെ ടാസ്കുകൾ, ഷെഡ്യൂൾ, ഡോക്യുമെന്റുകൾ വായിക്കുന്നു. ചോദ്യങ്ങൾക്ക് ഉത്തരം നൽകാനും വൈകലുകൾ വിശദീകരിക്കാനും ഡോക്യുമെന്റ് ഭാഗങ്ങൾ എഴുതാനും ടാസ്കുകൾ ചേർക്കാനോ പുതുക്കാനോ ഇതിന് കഴിയും. മുകളിലെ ചോദ്യങ്ങളിൽ ഒന്ന് പരീക്ഷിക്കുക, അല്ലെങ്കിൽ സ്വന്തമായി എഴുതുക.","PRISM lit vos tâches, votre planning et vos documents. Il répond aux questions, explique les retards, rédige des sections et ajoute ou met à jour des tâches. Essayez une question ci-dessus ou tapez la vôtre.","PRISM lee tus tareas, tu calendario y tus documentos. Responde preguntas, explica retrasos, redacta secciones y añade o actualiza tareas. Prueba una de las preguntas de arriba o escribe la tuya."],
"To switch to a new subject, type a topic in":["للانتقال إلى موضوع جديد، اكتب موضوعًا في","नए विषय पर जाने के लिए, विषय लिखें:","புதிய தலைப்புக்கு மாற, இங்கே தலைப்பை எழுதவும்:","പുതിയ വിഷയത്തിലേക്ക് മാറാൻ, ഇവിടെ വിഷയം ടൈപ്പ് ചെയ്യുക:","Pour changer de sujet, saisissez un sujet dans","Para cambiar de tema, escribe un tema en"],

", or just say \"make a project for a hospital management system\". PRISM then rewrites the tasks, Gantt chart, charts and all three documents for that topic.":["، أو قل فقط \"أنشئ مشروعًا لنظام إدارة مستشفى\". سيعيد PRISM كتابة المهام ومخطط جانت والرسوم البيانية والمستندات الثلاثة لهذا الموضوع.","या बस कहें \"अस्पताल प्रबंधन प्रणाली के लिए प्रोजेक्ट बनाओ\"। PRISM उस विषय के लिए कार्य, गैंट चार्ट, चार्ट और तीनों दस्तावेज़ फिर से लिखेगा।","அல்லது \"மருத்துவமனை மேலாண்மை அமைப்புக்கு ஒரு திட்டம் உருவாக்கு\" என்று சொல்லுங்கள். PRISM அந்தத் தலைப்புக்கான பணிகள், கேன்ட் விளக்கப்படம், வரைபடங்கள் மற்றும் மூன்று ஆவணங்களையும் மீண்டும் எழுதும்.","അല്ലെങ്കിൽ \"ഒരു ഹോസ്പിറ്റൽ മാനേജ്മെന്റ് സിസ്റ്റത്തിന് പ്രോജക്ട് ഉണ്ടാക്കൂ\" എന്ന് പറയുക. PRISM ആ വിഷയത്തിനായി ടാസ്കുകൾ, ഗാന്റ് ചാർട്ട്, ചാർട്ടുകൾ, മൂന്ന് ഡോക്യുമെന്റുകളും പുതുതായി എഴുതും.",", ou dites simplement « crée un projet pour un système de gestion hospitalière ». PRISM réécrit alors les tâches, le Gantt, les graphiques et les trois documents pour ce sujet.",", o di simplemente \"crea un proyecto para un sistema de gestión hospitalaria\". PRISM reescribe las tareas, el Gantt, los gráficos y los tres documentos para ese tema."],

"e.g. Add a task 'Security review' for Omar, 3 days, after T4":["مثال: أضف مهمة 'مراجعة أمنية' لعمر، 3 أيام، بعد T4","जैसे: उमर के लिए 'सुरक्षा समीक्षा' कार्य जोड़ें, 3 दिन, T4 के बाद","எ.கா. ஓமருக்கு 'பாதுகாப்பு மதிப்பாய்வு' பணி, 3 நாட்கள், T4-க்குப் பின் சேர்","ഉദാ: ഒമറിന് 'സെക്യൂരിറ്റി റിവ്യൂ' ടാസ്ക് ചേർക്കുക, 3 ദിവസം, T4-ന് ശേഷം","ex. Ajoute une tâche « Revue sécurité » pour Omar, 3 jours, après T4","p. ej. Añade la tarea 'Revisión de seguridad' para Omar, 3 días, después de T4"],
"Type a topic. PRISM writes the tasks with predecessors, the Gantt chart, the charts and all three documents for it. Your other projects stay in the Project menu.":["اكتب موضوعًا. يكتب PRISM المهام مع المهام السابقة ومخطط جانت والرسوم البيانية والمستندات الثلاثة. تبقى مشاريعك الأخرى في قائمة المشروع.","एक विषय लिखें। PRISM उसके लिए पूर्ववर्ती सहित कार्य, गैंट चार्ट, चार्ट और तीनों दस्तावेज़ लिखेगा। आपके अन्य प्रोजेक्ट प्रोजेक्ट मेनू में रहेंगे।","ஒரு தலைப்பை எழுதுங்கள். PRISM முன்னோடிகளுடன் பணிகள், கேன்ட் விளக்கப்படம், வரைபடங்கள், மூன்று ஆவணங்களையும் எழுதும். உங்கள் மற்ற திட்டங்கள் திட்டப் பட்டியலில் இருக்கும்.","ഒരു വിഷയം ടൈപ്പ് ചെയ്യുക. PRISM മുൻഗാമികളോടെ ടാസ്കുകൾ, ഗാന്റ് ചാർട്ട്, ചാർട്ടുകൾ, മൂന്ന് ഡോക്യുമെന്റുകളും എഴുതും. മറ്റ് പ്രോജക്ടുകൾ പ്രോജക്ട് മെനുവിൽ തുടരും.","Saisissez un sujet. PRISM rédige les tâches avec leurs prédécesseurs, le Gantt, les graphiques et les trois documents. Vos autres projets restent dans le menu Projet.","Escribe un tema. PRISM crea las tareas con sus predecesoras, el Gantt, los gráficos y los tres documentos. Tus otros proyectos siguen en el menú Proyecto."],

"Could not write: {list}. Use \"Draft empty sections with AI\" on that page to try again.":["تعذرت كتابة: {list}. استخدم \"صياغة الأقسام الفارغة\" في تلك الصفحة للمحاولة مجددًا.","नहीं लिखा जा सका: {list}। फिर से कोशिश के लिए उस पेज पर \"खाली हिस्से AI से लिखें\" का उपयोग करें।","எழுத முடியவில்லை: {list}. மீண்டும் முயல அந்தப் பக்கத்தில் \"காலிப் பகுதிகளை AI மூலம் எழுது\" பயன்படுத்தவும்.","എഴുതാനായില്ല: {list}. വീണ്ടും ശ്രമിക്കാൻ ആ പേജിൽ \"ശൂന്യ ഭാഗങ്ങൾ AI ഉപയോഗിച്ച് എഴുതുക\" ഉപയോഗിക്കുക.","Impossible de rédiger : {list}. Utilisez « Rédiger les sections vides avec l'IA » sur cette page.","No se pudo redactar: {list}. Usa \"Redactar secciones vacías con IA\" en esa página."],
"Open Gantt Chart to see the dependencies, Task Tracking for the charts, and the document pages to review and download. Ask me anything about this project.":["افتح مخطط جانت لرؤية الاعتماديات، وتتبع المهام للرسوم البيانية، وصفحات المستندات للمراجعة والتنزيل. اسألني أي شيء عن هذا المشروع.","निर्भरताएँ देखने के लिए गैंट चार्ट, चार्ट के लिए कार्य ट्रैकिंग, और समीक्षा व डाउनलोड के लिए दस्तावेज़ पेज खोलें। इस प्रोजेक्ट के बारे में कुछ भी पूछें।","சார்புகளைக் காண கேன்ட் விளக்கப்படத்தையும், வரைபடங்களுக்குப் பணி கண்காணிப்பையும், மதிப்பாய்வு மற்றும் பதிவிறக்கத்திற்கு ஆவணப் பக்கங்களையும் திறக்கவும். இந்தத் திட்டம் பற்றி எதையும் கேளுங்கள்.","ആശ്രയത്വങ്ങൾ കാണാൻ ഗാന്റ് ചാർട്ടും, ചാർട്ടുകൾക്ക് ടാസ്ക് ട്രാക്കിംഗും, പരിശോധിക്കാനും ഡൗൺലോഡ് ചെയ്യാനും ഡോക്യുമെന്റ് പേജുകളും തുറക്കുക. ഈ പ്രോജക്ടിനെക്കുറിച്ച് എന്തും ചോദിക്കുക.","Ouvrez le Gantt pour voir les dépendances, le Suivi des tâches pour les graphiques et les pages de documents pour relire et télécharger. Posez-moi vos questions sur ce projet.","Abre el Gantt para ver las dependencias, el Seguimiento para los gráficos y las páginas de documentos para revisar y descargar. Pregúntame lo que quieras sobre este proyecto."],
"PRISM could not plan that topic. Try wording it differently.":["تعذر على PRISM تخطيط هذا الموضوع. جرّب صياغة مختلفة.","PRISM इस विषय की योजना नहीं बना सका। दूसरे शब्दों में लिखें।","PRISM அந்தத் தலைப்பைத் திட்டமிட முடியவில்லை. வேறு விதமாக எழுதிப் பாருங்கள்.","PRISM-ന് ആ വിഷയം പ്ലാൻ ചെയ്യാനായില്ല. മറ്റൊരു രീതിയിൽ എഴുതി നോക്കൂ.","PRISM n'a pas pu planifier ce sujet. Reformulez-le.","PRISM no pudo planificar ese tema. Prueba a redactarlo de otra forma."],

"Too many questions at once. Wait a minute and ask again.":["أسئلة كثيرة في وقت واحد. انتظر دقيقة ثم اسأل مجددًا.","एक साथ बहुत सारे सवाल। एक मिनट रुककर फिर पूछें।","ஒரே நேரத்தில் பல கேள்விகள். ஒரு நிமிடம் காத்திருந்து மீண்டும் கேளுங்கள்.","ഒരേസമയം നിരവധി ചോദ്യങ്ങൾ. ഒരു മിനിറ്റ് കാത്തിരുന്ന് വീണ്ടും ചോദിക്കുക.","Trop de questions à la fois. Attendez une minute.","Demasiadas preguntas a la vez. Espera un minuto."],

"Fill each section, or let PRISM draft it. The preview is exactly what you download.":["املأ كل قسم أو دع PRISM يصوغه. المعاينة هي ما ستنزّله تمامًا.","हर हिस्सा भरें या PRISM से लिखवाएँ। पूर्वावलोकन वही है जो आप डाउनलोड करेंगे।","ஒவ்வொரு பகுதியையும் நிரப்புங்கள் அல்லது PRISM எழுதட்டும். முன்னோட்டமே நீங்கள் பதிவிறக்குவது.","ഓരോ ഭാഗവും പൂരിപ്പിക്കുക, അല്ലെങ്കിൽ PRISM എഴുതട്ടെ. പ്രിവ്യൂ തന്നെയാണ് ഡൗൺലോഡ് ചെയ്യുന്നത്.","Remplissez chaque section ou laissez PRISM la rédiger. L'aperçu est exactement ce que vous téléchargez.","Rellena cada sección o deja que PRISM la redacte. La vista previa es exactamente lo que descargas."],
"A full technical specification template. Fill it in or let PRISM draft it from your project details.":["قالب مواصفات فنية كامل. املأه أو دع PRISM يصوغه من تفاصيل مشروعك.","पूरा तकनीकी विनिर्देश टेम्पलेट। इसे भरें या PRISM से अपने प्रोजेक्ट विवरण के आधार पर लिखवाएँ।","முழுமையான தொழில்நுட்ப விவரக்குறிப்பு வார்ப்புரு. நிரப்புங்கள் அல்லது உங்கள் திட்ட விவரங்களிலிருந்து PRISM எழுதட்டும்.","പൂർണ്ണമായ സാങ്കേതിക സ്പെസിഫിക്കേഷൻ ടെംപ്ലേറ്റ്. പൂരിപ്പിക്കുക, അല്ലെങ്കിൽ നിങ്ങളുടെ പ്രോജക്ട് വിവരങ്ങളിൽ നിന്ന് PRISM എഴുതട്ടെ.","Un modèle complet de spécification technique. Remplissez-le ou laissez PRISM le rédiger à partir de votre projet.","Una plantilla completa de especificación técnica. Rellénala o deja que PRISM la redacte con los datos de tu proyecto."],
"Your end-of-project report. Schedule and task analysis fill in automatically from your tasks.":["تقرير نهاية مشروعك. يُملأ تحليل الجدول والمهام تلقائيًا من مهامك.","आपकी प्रोजेक्ट-समाप्ति रिपोर्ट। शेड्यूल और कार्य विश्लेषण आपके कार्यों से अपने-आप भरते हैं।","உங்கள் திட்ட நிறைவு அறிக்கை. அட்டவணை மற்றும் பணிப் பகுப்பாய்வு உங்கள் பணிகளிலிருந்து தானாக நிரம்பும்.","നിങ്ങളുടെ പ്രോജക്ട് അവസാന റിപ്പോർട്ട്. ഷെഡ്യൂളും ടാസ്ക് വിശകലനവും ടാസ്കുകളിൽ നിന്ന് സ്വയം പൂരിപ്പിക്കും.","Votre rapport de fin de projet. Le planning et l'analyse des tâches se remplissent automatiquement.","Tu informe de cierre. El calendario y el análisis de tareas se rellenan automáticamente."],

"Empty sections print as guidance text, so a blank download works as a ready template.":["تُطبع الأقسام الفارغة كنص إرشادي، لذا يصلح التنزيل الفارغ كقالب جاهز.","खाली हिस्से मार्गदर्शन पाठ के रूप में छपते हैं, इसलिए खाली डाउनलोड तैयार टेम्पलेट है।","காலிப் பகுதிகள் வழிகாட்டு உரையாக அச்சாகும்; எனவே காலியான பதிவிறக்கம் தயாரான வார்ப்புருவாகும்.","ശൂന്യ ഭാഗങ്ങൾ മാർഗ്ഗനിർദ്ദേശ വാചകമായി വരും, അതിനാൽ ശൂന്യ ഡൗൺലോഡ് റെഡിമെയ്ഡ് ടെംപ്ലേറ്റാണ്.","Les sections vides s'impriment comme consignes : un téléchargement vierge sert de modèle.","Las secciones vacías se imprimen como guía, así que una descarga en blanco sirve de plantilla."],
"Filled in automatically from project details.":["تُملأ تلقائيًا من تفاصيل المشروع.","प्रोजेक्ट विवरण से अपने-आप भरा जाता है।","திட்ட விவரங்களிலிருந்து தானாக நிரப்பப்படும்.","പ്രോജക്ട് വിവരങ്ങളിൽ നിന്ന് സ്വയം പൂരിപ്പിക്കും.","Rempli automatiquement à partir du projet.","Se rellena con los datos del proyecto."],

"Why does this project exist? Describe the business problem or opportunity and the context behind it.":["لماذا يوجد هذا المشروع؟ صف مشكلة العمل أو الفرصة والسياق المحيط بها.","यह प्रोजेक्ट क्यों है? व्यावसायिक समस्या या अवसर और उसका संदर्भ बताइए।","இந்தத் திட்டம் ஏன்? வணிகச் சிக்கல் அல்லது வாய்ப்பையும் அதன் பின்னணியையும் விவரிக்கவும்.","ഈ പ്രോജക്ട് എന്തിന്? ബിസിനസ് പ്രശ്നമോ അവസരമോ അതിന്റെ പശ്ചാത്തലവും വിവരിക്കുക.","Pourquoi ce projet ? Décrivez le problème ou l'opportunité métier et son contexte.","¿Por qué existe este proyecto? Describe el problema u oportunidad de negocio y su contexto."],
"List 3 to 5 measurable objectives.\n- Objective 1 (target, measure, date)\n- Objective 2":["اذكر من 3 إلى 5 أهداف قابلة للقياس.\n- الهدف 1 (المستهدف، المقياس، التاريخ)\n- الهدف 2","3 से 5 मापने योग्य लक्ष्य लिखें।\n- लक्ष्य 1 (लक्ष्य, माप, तिथि)\n- लक्ष्य 2","அளவிடக்கூடிய 3 முதல் 5 குறிக்கோள்களைப் பட்டியலிடுங்கள்.\n- குறிக்கோள் 1 (இலக்கு, அளவீடு, தேதி)\n- குறிக்கோள் 2","അളക്കാവുന്ന 3 മുതൽ 5 വരെ ലക്ഷ്യങ്ങൾ എഴുതുക.\n- ലക്ഷ്യം 1 (ടാർഗറ്റ്, അളവ്, തീയതി)\n- ലക്ഷ്യം 2","Listez 3 à 5 objectifs mesurables.\n- Objectif 1 (cible, mesure, date)\n- Objectif 2","Enumera de 3 a 5 objetivos medibles.\n- Objetivo 1 (meta, medida, fecha)\n- Objetivo 2"],

"List each deliverable with a one-line description and acceptance criterion.":["اذكر كل مُخرج مع وصف من سطر واحد ومعيار القبول.","हर डिलीवरेबल को एक पंक्ति के विवरण और स्वीकृति मानदंड के साथ लिखें।","ஒவ்வொரு வழங்கலையும் ஒரு வரி விளக்கம் மற்றும் ஏற்பு அளவுகோலுடன் பட்டியலிடுங்கள்.","ഓരോ ഡെലിവറബിളും ഒറ്റവരി വിവരണവും സ്വീകാര്യതാ മാനദണ്ഡവും സഹിതം എഴുതുക.","Listez chaque livrable avec une description d'une ligne et un critère d'acceptation.","Enumera cada entregable con una descripción de una línea y su criterio de aceptación."],
"Who is involved and what they are responsible for (Sponsor, PM, team leads, client contacts).":["من المشاركون وما مسؤولياتهم (الراعي، مدير المشروع، قادة الفرق، جهات اتصال العميل).","कौन शामिल है और किसकी क्या ज़िम्मेदारी है (प्रायोजक, PM, टीम लीड, क्लाइंट संपर्क)।","யார் ஈடுபட்டுள்ளனர், அவர்களின் பொறுப்பு என்ன (ஆதரவாளர், PM, குழுத் தலைவர்கள், வாடிக்கையாளர் தொடர்புகள்).","ആരൊക്കെ ഉൾപ്പെടുന്നു, ഓരോരുത്തരുടെയും ഉത്തരവാദിത്തം (സ്പോൺസർ, PM, ടീം ലീഡുകൾ, ക്ലയന്റ് കോൺടാക്റ്റുകൾ).","Qui intervient et de quoi chacun est responsable (sponsor, chef de projet, responsables, contacts client).","Quién participa y de qué es responsable (patrocinador, jefe de proyecto, líderes, contactos del cliente)."],
"Estimated cost by category (people, tools, licences, contingency) and the team resources needed.":["التكلفة التقديرية حسب الفئة (الأفراد، الأدوات، التراخيص، الطوارئ) وموارد الفريق المطلوبة.","श्रेणी के अनुसार अनुमानित लागत (लोग, टूल, लाइसेंस, आकस्मिक) और ज़रूरी टीम संसाधन।","வகைவாரியான மதிப்பீட்டுச் செலவு (மனிதவளம், கருவிகள், உரிமங்கள், அவசர நிதி) மற்றும் தேவையான குழு வளங்கள்.","വിഭാഗം തിരിച്ചുള്ള ഏകദേശ ചെലവ് (ആളുകൾ, ടൂളുകൾ, ലൈസൻസുകൾ, കണ്ടിൻജൻസി) ആവശ്യമായ ടീം വിഭവങ്ങളും.","Coût estimé par catégorie (personnel, outils, licences, provisions) et ressources nécessaires.","Coste estimado por categoría (personas, herramientas, licencias, contingencia) y recursos del equipo."],
"- Risk: … | Likelihood: H/M/L | Impact: H/M/L | Mitigation: …":["- الخطر: … | الاحتمال: مرتفع/متوسط/منخفض | الأثر: مرتفع/متوسط/منخفض | التخفيف: …","- जोखिम: … | संभावना: H/M/L | प्रभाव: H/M/L | निवारण: …","- அபாயம்: … | வாய்ப்பு: H/M/L | தாக்கம்: H/M/L | தணிப்பு: …","- അപകടസാധ്യത: … | സാധ്യത: H/M/L | ആഘാതം: H/M/L | ലഘൂകരണം: …","- Risque : … | Probabilité : É/M/F | Impact : É/M/F | Atténuation : …","- Riesgo: … | Probabilidad: A/M/B | Impacto: A/M/B | Mitigación: …"],
"Assumptions the plan depends on, and fixed constraints (dates, budget, technology, regulation).":["الافتراضات التي تعتمد عليها الخطة والقيود الثابتة (التواريخ، الميزانية، التقنية، الأنظمة).","योजना जिन धारणाओं पर निर्भर है, और तय बाधाएँ (तिथियाँ, बजट, तकनीक, नियम)।","திட்டம் சார்ந்துள்ள அனுமானங்கள் மற்றும் நிலையான கட்டுப்பாடுகள் (தேதிகள், பட்ஜெட், தொழில்நுட்பம், விதிமுறைகள்).","പ്ലാൻ ആശ്രയിക്കുന്ന അനുമാനങ്ങളും സ്ഥിരമായ പരിമിതികളും (തീയതികൾ, ബജറ്റ്, ടെക്നോളജി, നിയന്ത്രണങ്ങൾ).","Hypothèses dont dépend le plan et contraintes fixes (dates, budget, technologie, réglementation).","Supuestos de los que depende el plan y restricciones fijas (fechas, presupuesto, tecnología, normativa)."],
"What system this document describes, who it is for, and what it covers.":["ما النظام الذي يصفه هذا المستند، ولمن هو، وما الذي يغطيه.","यह दस्तावेज़ किस सिस्टम का वर्णन करता है, किसके लिए है और क्या शामिल करता है।","இந்த ஆவணம் எந்த அமைப்பை விவரிக்கிறது, யாருக்கானது, எதை உள்ளடக்குகிறது.","ഈ ഡോക്യുമെന്റ് ഏത് സിസ്റ്റം വിവരിക്കുന്നു, ആർക്ക് വേണ്ടി, എന്തെല്ലാം ഉൾക്കൊള്ളുന്നു.","Quel système ce document décrit, à qui il s'adresse et ce qu'il couvre.","Qué sistema describe este documento, para quién es y qué cubre."],
"A short description of the system, its users and its main capabilities.":["وصف موجز للنظام ومستخدميه وقدراته الرئيسية.","सिस्टम, उसके उपयोगकर्ताओं और मुख्य क्षमताओं का संक्षिप्त विवरण।","அமைப்பு, அதன் பயனர்கள் மற்றும் முக்கியத் திறன்கள் பற்றிய சுருக்கமான விளக்கம்.","സിസ്റ്റം, ഉപയോക്താക്കൾ, പ്രധാന കഴിവുകൾ എന്നിവയുടെ ചെറു വിവരണം.","Une courte description du système, de ses utilisateurs et de ses fonctions principales.","Una breve descripción del sistema, sus usuarios y sus funciones principales."],
"Main components and how they interact (front end, back end, database, integrations). Add a diagram reference if you have one.":["المكونات الرئيسية وكيفية تفاعلها (الواجهة الأمامية، الخلفية، قاعدة البيانات، التكاملات). أضف مرجعًا لمخطط إن وجد.","मुख्य घटक और वे कैसे जुड़ते हैं (फ़्रंट एंड, बैक एंड, डेटाबेस, इंटीग्रेशन)। हो तो आरेख का संदर्भ जोड़ें।","முக்கியக் கூறுகள் மற்றும் அவை எவ்வாறு இணைகின்றன (முன்முனை, பின்முனை, தரவுத்தளம், ஒருங்கிணைப்புகள்). வரைபடம் இருந்தால் குறிப்பிடவும்.","പ്രധാന ഘടകങ്ങളും അവ എങ്ങനെ ഇടപെടുന്നു എന്നതും (ഫ്രണ്ട് എൻഡ്, ബാക്ക് എൻഡ്, ഡാറ്റാബേസ്, ഇന്റഗ്രേഷനുകൾ). ഡയഗ്രം ഉണ്ടെങ്കിൽ സൂചിപ്പിക്കുക.","Composants principaux et leurs interactions (front, back, base de données, intégrations). Ajoutez un schéma si vous en avez un.","Componentes principales y cómo interactúan (front end, back end, base de datos, integraciones). Añade un diagrama si lo tienes."],
"- Front end:\n- Back end:\n- Database:\n- Hosting / cloud:\n- Tools:":["- الواجهة الأمامية:\n- الواجهة الخلفية:\n- قاعدة البيانات:\n- الاستضافة / السحابة:\n- الأدوات:","- फ़्रंट एंड:\n- बैक एंड:\n- डेटाबेस:\n- होस्टिंग / क्लाउड:\n- टूल:","- முன்முனை:\n- பின்முனை:\n- தரவுத்தளம்:\n- ஹோஸ்டிங் / கிளவுட்:\n- கருவிகள்:","- ഫ്രണ്ട് എൻഡ്:\n- ബാക്ക് എൻഡ്:\n- ഡാറ്റാബേസ്:\n- ഹോസ്റ്റിംഗ് / ക്ലൗഡ്:\n- ടൂളുകൾ:","- Front-end :\n- Back-end :\n- Base de données :\n- Hébergement / cloud :\n- Outils :","- Front end:\n- Back end:\n- Base de datos:\n- Alojamiento / nube:\n- Herramientas:"],

"Performance, availability, scalability, usability, compliance targets.":["أهداف الأداء والتوافر وقابلية التوسع وسهولة الاستخدام والامتثال.","प्रदर्शन, उपलब्धता, स्केलेबिलिटी, उपयोगिता, अनुपालन लक्ष्य।","செயல்திறன், கிடைக்கும் தன்மை, அளவிடுதல், பயன்பாட்டுத் தன்மை, இணக்க இலக்குகள்.","പെർഫോമൻസ്, ലഭ്യത, സ്കേലബിലിറ്റി, ഉപയോഗക്ഷമത, കംപ്ലയൻസ് ലക്ഷ്യങ്ങൾ.","Objectifs de performance, disponibilité, évolutivité, ergonomie, conformité.","Objetivos de rendimiento, disponibilidad, escalabilidad, usabilidad y cumplimiento."],
"Key entities, fields, relationships, data retention.":["الكيانات الرئيسية والحقول والعلاقات والاحتفاظ بالبيانات.","मुख्य इकाइयाँ, फ़ील्ड, संबंध, डेटा प्रतिधारण।","முக்கிய உருப்படிகள், புலங்கள், உறவுகள், தரவு தக்கவைப்பு.","പ്രധാന എന്റിറ്റികൾ, ഫീൽഡുകൾ, ബന്ധങ്ങൾ, ഡാറ്റ സൂക്ഷിക്കൽ.","Entités clés, champs, relations, conservation des données.","Entidades clave, campos, relaciones, retención de datos."],
"Endpoints or integrations: name, method, input, output, authentication.":["نقاط النهاية أو التكاملات: الاسم، الطريقة، المدخلات، المخرجات، المصادقة.","एंडपॉइंट या इंटीग्रेशन: नाम, मेथड, इनपुट, आउटपुट, प्रमाणीकरण।","முனைப்புள்ளிகள் அல்லது ஒருங்கிணைப்புகள்: பெயர், முறை, உள்ளீடு, வெளியீடு, அங்கீகாரம்.","എൻഡ്‌പോയിന്റുകൾ അല്ലെങ്കിൽ ഇന്റഗ്രേഷനുകൾ: പേര്, മെത്തേഡ്, ഇൻപുട്ട്, ഔട്ട്പുട്ട്, ഓതന്റിക്കേഷൻ.","Points d'accès ou intégrations : nom, méthode, entrée, sortie, authentification.","Endpoints o integraciones: nombre, método, entrada, salida, autenticación."],
"Authentication, authorisation, encryption, secrets handling, audit logging.":["المصادقة والتفويض والتشفير وإدارة الأسرار وسجلات التدقيق.","प्रमाणीकरण, प्राधिकरण, एन्क्रिप्शन, सीक्रेट प्रबंधन, ऑडिट लॉगिंग।","அங்கீகாரம், அனுமதி, குறியாக்கம், ரகசிய மேலாண்மை, தணிக்கைப் பதிவு.","ഓതന്റിക്കേഷൻ, ഓതറൈസേഷൻ, എൻക്രിപ്ഷൻ, സീക്രട്ട് കൈകാര്യം, ഓഡിറ്റ് ലോഗിംഗ്.","Authentification, autorisation, chiffrement, gestion des secrets, journal d'audit.","Autenticación, autorización, cifrado, gestión de secretos, registro de auditoría."],
"Unit, integration, UAT, performance testing: scope, tools, entry and exit criteria.":["اختبارات الوحدة والتكامل وقبول المستخدم والأداء: النطاق والأدوات ومعايير الدخول والخروج.","यूनिट, इंटीग्रेशन, UAT, परफ़ॉर्मेंस टेस्टिंग: दायरा, टूल, प्रवेश और निकास मानदंड।","அலகு, ஒருங்கிணைப்பு, UAT, செயல்திறன் சோதனை: வரம்பு, கருவிகள், நுழைவு மற்றும் வெளியேறும் அளவுகோல்கள்.","യൂണിറ്റ്, ഇന്റഗ്രേഷൻ, UAT, പെർഫോമൻസ് ടെസ്റ്റിംഗ്: വ്യാപ്തി, ടൂളുകൾ, എൻട്രി, എക്സിറ്റ് മാനദണ്ഡങ്ങൾ.","Tests unitaires, d'intégration, recette, performance : périmètre, outils, critères d'entrée et de sortie.","Pruebas unitarias, de integración, UAT y rendimiento: alcance, herramientas, criterios de entrada y salida."],
"Environments (dev, test, prod), release process, rollback plan, monitoring.":["البيئات (التطوير، الاختبار، الإنتاج)، عملية الإصدار، خطة التراجع، المراقبة.","एनवायरनमेंट (dev, test, prod), रिलीज़ प्रक्रिया, रोलबैक योजना, मॉनिटरिंग।","சூழல்கள் (dev, test, prod), வெளியீட்டுச் செயல்முறை, திரும்பப்பெறும் திட்டம், கண்காணிப்பு.","എൻവയോൺമെന്റുകൾ (dev, test, prod), റിലീസ് പ്രക്രിയ, റോൾബാക്ക് പ്ലാൻ, മോണിറ്ററിംഗ്.","Environnements (dev, test, prod), processus de livraison, retour arrière, supervision.","Entornos (dev, test, prod), proceso de publicación, plan de reversión, monitorización."],
"Term: definition":["المصطلح: التعريف","शब्द: परिभाषा","சொல்: வரையறை","പദം: നിർവചനം","Terme : définition","Término: definición"],
"Half a page: what the project set out to do, what was delivered, and the headline result.":["نصف صفحة: ما الذي هدف إليه المشروع، وما الذي سُلّم، والنتيجة الرئيسية.","आधा पेज: प्रोजेक्ट का लक्ष्य क्या था, क्या दिया गया और मुख्य परिणाम।","அரைப் பக்கம்: திட்டத்தின் நோக்கம், வழங்கப்பட்டது, முக்கிய முடிவு.","അര പേജ്: പ്രോജക്ട് ലക്ഷ്യമിട്ടത്, നൽകിയത്, പ്രധാന ഫലം.","Une demi-page : l'objectif du projet, ce qui a été livré et le résultat principal.","Media página: qué pretendía el proyecto, qué se entregó y el resultado principal."],
"Background, sponsor, team and the period covered.":["الخلفية والراعي والفريق والفترة المشمولة.","पृष्ठभूमि, प्रायोजक, टीम और अवधि।","பின்னணி, ஆதரவாளர், குழு மற்றும் காலம்.","പശ്ചാത്തലം, സ്പോൺസർ, ടീം, കാലയളവ്.","Contexte, sponsor, équipe et période couverte.","Contexto, patrocinador, equipo y periodo cubierto."],
"- Objective → Outcome → Met / Partly met / Not met":["- الهدف → النتيجة → تحقق / تحقق جزئيًا / لم يتحقق","- लक्ष्य → परिणाम → पूरा / आंशिक / नहीं","- குறிக்கோள் → விளைவு → நிறைவேறியது / பகுதியளவு / இல்லை","- ലക്ഷ്യം → ഫലം → നേടി / ഭാഗികമായി / നേടിയില്ല","- Objectif → Résultat → Atteint / Partiellement / Non atteint","- Objetivo → Resultado → Cumplido / Parcial / No cumplido"],
"Planned budget, actual spend, variance and the reasons for it.":["الميزانية المخططة والإنفاق الفعلي والفرق وأسبابه.","नियोजित बजट, वास्तविक खर्च, अंतर और उसके कारण।","திட்டமிட்ட பட்ஜெட், உண்மையான செலவு, வேறுபாடு மற்றும் காரணங்கள்.","പ്ലാൻ ചെയ്ത ബജറ്റ്, യഥാർത്ഥ ചെലവ്, വ്യത്യാസം, കാരണങ്ങൾ.","Budget prévu, dépenses réelles, écart et ses raisons.","Presupuesto previsto, gasto real, desviación y sus causas."],
"Each deliverable, who received it and the date of acceptance.":["كل مُخرج ومن استلمه وتاريخ القبول.","हर डिलीवरेबल, किसने प्राप्त किया और स्वीकृति की तिथि।","ஒவ்வொரு வழங்கலும், பெற்றவர் மற்றும் ஏற்பு தேதி.","ഓരോ ഡെലിവറബിളും, സ്വീകരിച്ചയാളും, സ്വീകരിച്ച തീയതിയും.","Chaque livrable, son destinataire et sa date de réception.","Cada entregable, quién lo recibió y la fecha de aceptación."],
"What went wrong, its impact, and how it was resolved.":["ما الذي حدث خطأً وأثره وكيف حُلّ.","क्या गलत हुआ, उसका प्रभाव और कैसे सुलझाया गया।","என்ன தவறானது, அதன் தாக்கம், எவ்வாறு தீர்க்கப்பட்டது.","എന്താണ് തെറ്റിയത്, അതിന്റെ ആഘാതം, എങ്ങനെ പരിഹരിച്ചു.","Ce qui n'a pas fonctionné, son impact et sa résolution.","Qué salió mal, su impacto y cómo se resolvió."],
"What to keep doing, what to change next time.":["ما يجب الاستمرار فيه وما يجب تغييره في المرة القادمة.","क्या जारी रखें, अगली बार क्या बदलें।","தொடர வேண்டியவை, அடுத்த முறை மாற்ற வேண்டியவை.","തുടരേണ്ടത്, അടുത്ത തവണ മാറ്റേണ്ടത്.","Ce qu'il faut garder, ce qu'il faut changer la prochaine fois.","Qué mantener y qué cambiar la próxima vez."],
"Open items, support arrangements, follow-on work.":["البنود المفتوحة وترتيبات الدعم والأعمال اللاحقة.","बाकी काम, सहायता व्यवस्था, आगे का काम।","நிலுவையிலுள்ளவை, ஆதரவு ஏற்பாடுகள், தொடர் பணிகள்.","ബാക്കിയുള്ള കാര്യങ്ങൾ, സപ്പോർട്ട് ക്രമീകരണങ്ങൾ, തുടർ ജോലികൾ.","Points ouverts, support, travaux à venir.","Temas pendientes, soporte, trabajo posterior."],

"{done} of {total} tasks are complete. Overall progress, weighted by task duration, is {overall}% against {expected}% planned for {date}. Overdue tasks: {overdue}. Behind plan: {behind}. Planned finish: {end}.":["اكتملت {done} من {total} مهام. التقدم الإجمالي، المرجّح بمدة المهام، هو {overall}% مقابل {expected}% مخطط له في {date}. المهام المتأخرة: {overdue}. المتأخرة عن الخطة: {behind}. الانتهاء المخطط: {end}.","{total} में से {done} कार्य पूरे हैं। कार्य अवधि के अनुसार कुल प्रगति {overall}% है, जबकि {date} तक {expected}% की योजना थी। विलंबित कार्य: {overdue}। योजना से पीछे: {behind}। नियोजित समाप्ति: {end}।","{total} பணிகளில் {done} முடிந்தன. பணிக் காலத்தின்படி மொத்த முன்னேற்றம் {overall}%, {date} வரை திட்டமிட்டது {expected}%. தாமதமான பணிகள்: {overdue}. திட்டத்தை விடப் பின்தங்கியவை: {behind}. திட்டமிட்ட முடிவு: {end}.","{total} ടാസ്കുകളിൽ {done} എണ്ണം പൂർത്തിയായി. ടാസ്ക് ദൈർഘ്യം അനുസരിച്ച് ആകെ പുരോഗതി {overall}%, {date} വരെ പ്ലാൻ ചെയ്തത് {expected}%. വൈകിയ ടാസ്കുകൾ: {overdue}. പ്ലാനിനേക്കാൾ പിന്നിൽ: {behind}. പ്ലാൻ ചെയ്ത പൂർത്തി: {end}.","{done} tâches sur {total} sont terminées. L'avancement global, pondéré par la durée, est de {overall} % contre {expected} % prévus au {date}. Tâches en retard : {overdue}. En retard sur le plan : {behind}. Fin prévue : {end}.","{done} de {total} tareas están completas. El avance global, ponderado por duración, es del {overall}% frente al {expected}% previsto para el {date}. Tareas atrasadas: {overdue}. Por detrás del plan: {behind}. Fin previsto: {end}."],
"Bar = actual progress. Black tick = progress planned for today.":["العمود = التقدم الفعلي. العلامة السوداء = التقدم المخطط لليوم.","बार = वास्तविक प्रगति। काली रेखा = आज तक नियोजित प्रगति।","பட்டை = உண்மையான முன்னேற்றம். கருப்புக் குறி = இன்றுவரை திட்டமிட்ட முன்னேற்றம்.","ബാർ = യഥാർത്ഥ പുരോഗതി. കറുത്ത വര = ഇന്നത്തേക്ക് പ്ലാൻ ചെയ്ത പുരോഗതി.","Barre = avancement réel. Trait noir = avancement prévu aujourd'hui.","Barra = avance real. Marca negra = avance previsto para hoy."],

"Finish-to-start dependencies. Each task starts after all its predecessors finish. Red bars are the critical path.":["اعتماديات من النهاية إلى البداية. تبدأ كل مهمة بعد انتهاء كل المهام السابقة لها. الأعمدة الحمراء هي المسار الحرج.","फ़िनिश-टू-स्टार्ट निर्भरता। हर कार्य अपने सभी पूर्ववर्ती पूरे होने के बाद शुरू होता है। लाल बार क्रिटिकल पाथ हैं।","முடிவு-தொடக்கச் சார்புகள். ஒவ்வொரு பணியும் அதன் முன்னோடிகள் அனைத்தும் முடிந்த பின் தொடங்கும். சிவப்புப் பட்டைகள் முக்கியப் பாதை.","ഫിനിഷ്-ടു-സ്റ്റാർട്ട് ആശ്രയത്വങ്ങൾ. ഓരോ ടാസ്കും അതിന്റെ എല്ലാ മുൻഗാമികളും തീർന്ന ശേഷം തുടങ്ങുന്നു. ചുവന്ന ബാറുകൾ ക്രിട്ടിക്കൽ പാത്ത്.","Dépendances fin-début. Chaque tâche démarre quand tous ses prédécesseurs sont finis. Les barres rouges forment le chemin critique.","Dependencias fin-inicio. Cada tarea empieza cuando terminan todas sus predecesoras. Las barras rojas son la ruta crítica."],

"Type predecessor IDs separated by commas. Successors and dates are worked out for you. Slack is how many days a task can slip without delaying the finish.":["اكتب معرّفات المهام السابقة مفصولة بفواصل. تُحسب المهام اللاحقة والتواريخ تلقائيًا. الفائض هو عدد الأيام التي يمكن أن تتأخر فيها المهمة دون تأخير الانتهاء.","पूर्ववर्ती ID कॉमा से अलग करके लिखें। अनुवर्ती और तिथियाँ अपने-आप निकलती हैं। स्लैक बताता है कि कोई कार्य समाप्ति में देरी किए बिना कितने दिन खिसक सकता है।","முன்னோடி ID-களைக் காற்புள்ளியால் பிரித்து எழுதுங்கள். பின்தொடர்பவையும் தேதிகளும் தானாகக் கணக்கிடப்படும். இடைவெளி என்பது முடிவைத் தாமதப்படுத்தாமல் ஒரு பணி எத்தனை நாள் தள்ளிப்போகலாம் என்பது.","മുൻഗാമി ID-കൾ കോമ ഇട്ട് ടൈപ്പ് ചെയ്യുക. പിൻഗാമികളും തീയതികളും സ്വയം കണക്കാക്കും. പൂർത്തി വൈകിക്കാതെ ഒരു ടാസ്ക് എത്ര ദിവസം നീങ്ങാം എന്നതാണ് സ്ലാക്ക്.","Saisissez les ID des prédécesseurs séparés par des virgules. Successeurs et dates sont calculés pour vous. La marge indique de combien de jours une tâche peut glisser sans retarder la fin.","Escribe los ID de las predecesoras separados por comas. Las sucesoras y fechas se calculan solas. La holgura es cuántos días puede retrasarse una tarea sin retrasar el final."],

"Progress against plan for {date}. Update status and % complete below; the charts follow.":["التقدم مقابل الخطة في {date}. حدّث الحالة ونسبة الإنجاز أدناه وستتبعها الرسوم البيانية.","{date} के लिए योजना के मुकाबले प्रगति। नीचे स्थिति और % पूर्णता अपडेट करें; चार्ट साथ बदलेंगे।","{date} நிலவரப்படி திட்டத்துடன் ஒப்பிட்ட முன்னேற்றம். கீழே நிலையும் % நிறைவையும் புதுப்பியுங்கள்; வரைபடங்கள் பின்தொடரும்.","{date} വരെയുള്ള പ്ലാനുമായി താരതമ്യം ചെയ്ത പുരോഗതി. താഴെ സ്റ്റാറ്റസും % പൂർത്തിയും പുതുക്കുക; ചാർട്ടുകൾ അതനുസരിച്ച് മാറും.","Avancement par rapport au plan au {date}. Mettez à jour le statut et le % ci-dessous ; les graphiques suivent.","Avance frente al plan a {date}. Actualiza el estado y el % abajo; los gráficos se ajustan."],

"Bar = % complete (red when the task is overdue). Tick = where the task should be today. Hover a bar for details.":["العمود = نسبة الإنجاز (أحمر إذا تأخرت المهمة). العلامة = أين يجب أن تكون المهمة اليوم. مرّر على العمود للتفاصيل.","बार = % पूर्ण (कार्य विलंबित हो तो लाल)। रेखा = आज कार्य कहाँ होना चाहिए। विवरण के लिए बार पर माउस ले जाएँ।","பட்டை = % நிறைவு (தாமதமானால் சிவப்பு). குறி = இன்று பணி இருக்க வேண்டிய இடம். விவரங்களுக்குப் பட்டையின் மேல் சுட்டியை வைக்கவும்.","ബാർ = % പൂർത്തി (വൈകിയാൽ ചുവപ്പ്). വര = ഇന്ന് ടാസ്ക് എത്തേണ്ടിടം. വിവരങ്ങൾക്ക് ബാറിൽ മൗസ് വയ്ക്കുക.","Barre = % terminé (rouge si en retard). Trait = où la tâche devrait être aujourd'hui. Survolez une barre pour les détails.","Barra = % completado (roja si está atrasada). Marca = dónde debería estar hoy. Pasa el ratón por una barra para ver detalles."],

"Task-days per person, split into done and remaining.":["أيام المهام لكل شخص، مقسمة إلى منجزة ومتبقية.","प्रति व्यक्ति कार्य-दिवस, पूरे और शेष में बँटे।","ஒருவருக்கான பணி-நாட்கள், முடிந்தவை மற்றும் மீதமுள்ளவை.","ഓരോരുത്തരുടെയും ടാസ്ക്-ദിവസങ്ങൾ, പൂർത്തിയായതും ബാക്കിയും.","Jours-tâches par personne, terminés et restants.","Días de tarea por persona, hechos y pendientes."],

"Set each task's % complete here: drag the slider or type a number. The charts and the overall progress update at once.":["حدّد نسبة الإنجاز لكل مهمة هنا: اسحب المؤشر أو اكتب رقمًا. تتحدث الرسوم البيانية والتقدم الإجمالي فورًا.","यहाँ हर कार्य का % पूरा सेट करें: स्लाइडर खींचें या संख्या लिखें। चार्ट और कुल प्रगति तुरंत अपडेट होते हैं।","ஒவ்வொரு பணியின் முடிவு % இங்கே அமைக்கவும்: ஸ்லைடரை இழுக்கவும் அல்லது எண்ணை உள்ளிடவும். வரைபடங்களும் மொத்த முன்னேற்றமும் உடனே புதுப்பிக்கப்படும்.","ഓരോ ടാസ്കിന്റെയും പൂർത്തീകരണ % ഇവിടെ സജ്ജമാക്കുക: സ്ലൈഡർ വലിക്കുക അല്ലെങ്കിൽ സംഖ്യ ടൈപ്പ് ചെയ്യുക. ചാർട്ടുകളും ആകെ പുരോഗതിയും ഉടൻ പുതുക്കും.","Réglez ici le % d'avancement de chaque tâche : faites glisser le curseur ou tapez un nombre. Les graphiques et l'avancement global se mettent à jour aussitôt.","Ajusta aquí el % completado de cada tarea: arrastra el control o escribe un número. Los gráficos y el avance global se actualizan al instante."],
"The text inside these documents is in {from}. The headings follow the language menu, the text does not.":["النص داخل هذه المستندات مكتوب بـ{from}. العناوين تتبع قائمة اللغة، أما النص فلا.", "इन दस्तावेज़ों का टेक्स्ट {from} में है। शीर्षक भाषा मेनू के अनुसार बदलते हैं, टेक्स्ट नहीं।", "இந்த ஆவணங்களின் உரை {from} மொழியில் உள்ளது. தலைப்புகள் மொழி மெனுவைப் பின்பற்றும், உரை மாறாது.", "ഈ രേഖകളിലെ വാചകം {from} ഭാഷയിലാണ്. തലക്കെട്ടുകൾ ഭാഷാ മെനു പിന്തുടരും, വാചകം മാറില്ല.", "Le texte de ces documents est en {from}. Les titres suivent le menu des langues, pas le texte.", "El texto de estos documentos está en {from}. Los títulos siguen el menú de idioma, el texto no."],

"PRISM will rewrite the documents in {to} from your project data. Text you typed into the documents yourself will be replaced. Continue?":["سيعيد PRISM كتابة المستندات بـ{to} من بيانات مشروعك. سيتم استبدال النص الذي كتبته بنفسك في المستندات. هل تريد المتابعة؟", "PRISM आपके प्रोजेक्ट डेटा से दस्तावेज़ {to} में दोबारा लिखेगा। आपने खुद जो टेक्स्ट लिखा है, वह बदल जाएगा। जारी रखें?", "உங்கள் திட்டத் தரவிலிருந்து PRISM ஆவணங்களை {to} மொழியில் மீண்டும் எழுதும். நீங்களே எழுதிய உரை மாற்றப்படும். தொடரவா?", "നിങ്ങളുടെ പ്രോജക്റ്റ് ഡാറ്റയിൽ നിന്ന് PRISM രേഖകൾ {to} ഭാഷയിൽ വീണ്ടും എഴുതും. നിങ്ങൾ സ്വയം എഴുതിയ വാചകം മാറ്റപ്പെടും. തുടരണോ?", "PRISM va réécrire les documents en {to} à partir des données du projet. Le texte que vous avez saisi vous-même sera remplacé. Continuer ?", "PRISM reescribirá los documentos en {to} a partir de los datos del proyecto. El texto que escribiste tú se reemplazará. ¿Continuar?"],

"No team members yet. Add the people on this project; their names are suggested as task owners.":["لا يوجد أعضاء في الفريق بعد. أضف الأشخاص العاملين في هذا المشروع، وستظهر أسماؤهم كاقتراحات لمسؤولي المهام.", "अभी कोई टीम सदस्य नहीं है। इस प्रोजेक्ट के लोगों को जोड़ें; उनके नाम कार्य के ज़िम्मेदार के रूप में सुझाए जाएँगे।", "இன்னும் குழு உறுப்பினர்கள் இல்லை. இந்தத் திட்டத்தில் உள்ளவர்களைச் சேர்க்கவும்; அவர்களின் பெயர்கள் பணிப் பொறுப்பாளர்களாகப் பரிந்துரைக்கப்படும்.", "ഇതുവരെ ടീം അംഗങ്ങളില്ല. ഈ പ്രോജക്റ്റിലെ ആളുകളെ ചേർക്കുക; അവരുടെ പേരുകൾ ടാസ്ക് ഉത്തരവാദികളായി നിർദ്ദേശിക്കപ്പെടും.", "Aucun membre pour l'instant. Ajoutez les personnes du projet ; leurs noms seront proposés comme responsables des tâches.", "Aún no hay miembros. Añade a las personas del proyecto; sus nombres se sugerirán como responsables de las tareas."],

"No tasks for this person yet. Give them tasks in the Gantt Chart (Owner column).":["لا مهام لهذا الشخص بعد. أسند إليه مهام في مخطط جانت (عمود المسؤول).", "इस व्यक्ति के लिए अभी कोई कार्य नहीं। गैंट चार्ट (मालिक कॉलम) में कार्य दें।", "இவருக்கு இன்னும் பணிகள் இல்லை. கேன்ட் வரைபடத்தில் (பொறுப்பாளர் நெடுவரிசை) பணிகளைக் கொடுக்கவும்.", "ഈ വ്യക്തിക്ക് ഇതുവരെ ടാസ്കുകളില്ല. ഗാന്റ് ചാർട്ടിൽ (ഉടമ കോളം) ടാസ്കുകൾ നൽകുക.", "Aucune tâche pour cette personne. Attribuez-lui des tâches dans le diagramme de Gantt (colonne Responsable).", "Esta persona aún no tiene tareas. Asígnale tareas en el diagrama de Gantt (columna Responsable)."],
"Add team members on Ask PRISM first.":["أضف أعضاء الفريق في صفحة اسأل PRISM أولًا.", "पहले Ask PRISM पर टीम सदस्य जोड़ें।", "முதலில் PRISM-இடம் கேள் பக்கத்தில் குழு உறுப்பினர்களைச் சேர்க்கவும்.", "ആദ്യം Ask PRISM പേജിൽ ടീം അംഗങ്ങളെ ചേർക്കുക.", "Ajoutez d'abord des membres sur Demander à PRISM.", "Primero añade miembros en Pregunta a PRISM."],

"Untick the days your team does not work. Task durations then count working days only, and the Gantt chart skips weekends and holidays.":["ألغِ تحديد الأيام التي لا يعمل فيها فريقك. عندها تُحسب مدد المهام بأيام العمل فقط، ويتخطى مخطط جانت العطل الأسبوعية والرسمية.", "जिन दिनों आपकी टीम काम नहीं करती, उनका निशान हटाएँ। तब कार्य अवधि केवल कार्य दिवस गिनेगी और गैंट चार्ट सप्ताहांत व छुट्टियाँ छोड़ देगा।", "உங்கள் குழு வேலை செய்யாத நாட்களின் தேர்வை நீக்கவும். அப்போது பணிக் காலம் வேலை நாட்களை மட்டும் எண்ணும்; கேன்ட் வரைபடம் வார இறுதிகளையும் விடுமுறைகளையும் தவிர்க்கும்.", "ടീം ജോലി ചെയ്യാത്ത ദിവസങ്ങളുടെ ടിക്ക് മാറ്റുക. അപ്പോൾ ടാസ്ക് കാലയളവ് പ്രവൃത്തി ദിവസങ്ങൾ മാത്രം എണ്ണും, ഗാന്റ് ചാർട്ട് വാരാന്ത്യങ്ങളും അവധികളും ഒഴിവാക്കും.", "Décochez les jours où votre équipe ne travaille pas. Les durées comptent alors uniquement les jours ouvrés et le Gantt saute week-ends et jours fériés.", "Desmarca los días en que tu equipo no trabaja. Las duraciones contarán solo días laborables y el Gantt saltará fines de semana y festivos."],

"Drag a card to another column, or change its status in the card.":["اسحب البطاقة إلى عمود آخر، أو غيّر حالتها داخل البطاقة.", "कार्ड को दूसरे कॉलम में खींचें, या कार्ड में उसकी स्थिति बदलें।", "அட்டையை வேறு நெடுவரிசைக்கு இழுக்கவும், அல்லது அட்டையிலேயே நிலையை மாற்றவும்.", "കാർഡ് മറ്റൊരു കോളത്തിലേക്ക് വലിച്ചിടുക, അല്ലെങ്കിൽ കാർഡിൽ സ്റ്റാറ്റസ് മാറ്റുക.", "Faites glisser une carte vers une autre colonne ou changez son statut dans la carte.", "Arrastra una tarjeta a otra columna o cambia su estado en la tarjeta."],
"Record what the project spends. PRISM compares it with the budget and with progress.":["سجّل ما ينفقه المشروع. يقارنه PRISM بالميزانية وبالتقدم.", "प्रोजेक्ट का खर्च दर्ज करें। PRISM इसकी तुलना बजट और प्रगति से करता है।", "திட்டம் செலவழிப்பதைப் பதிவு செய்யுங்கள். PRISM அதை பட்ஜெட்டுடனும் முன்னேற்றத்துடனும் ஒப்பிடும்.", "പ്രോജക്റ്റിന്റെ ചെലവ് രേഖപ്പെടുത്തുക. PRISM അത് ബജറ്റുമായും പുരോഗതിയുമായും താരതമ്യം ചെയ്യും.", "Notez ce que le projet dépense. PRISM le compare au budget et à l'avancement.", "Registra lo que gasta el proyecto. PRISM lo compara con el presupuesto y el avance."],

"Set the project budget first, for example USD 50,000, in Project details or on Ask PRISM.":["حدّد ميزانية المشروع أولًا، مثل USD 50,000، في تفاصيل المشروع أو في اسأل PRISM.", "पहले प्रोजेक्ट बजट डालें, जैसे USD 50,000, प्रोजेक्ट विवरण में या Ask PRISM पर।", "முதலில் திட்ட பட்ஜெட்டை அமைக்கவும், உதா. USD 50,000, திட்ட விவரங்களில் அல்லது PRISM-இடம் கேள் பக்கத்தில்.", "ആദ്യം ബജറ്റ് നൽകുക, ഉദാ. USD 50,000, പ്രോജക്റ്റ് വിവരങ്ങളിലോ Ask PRISM-ലോ.", "Indiquez d'abord le budget, par exemple USD 50,000, dans les détails du projet ou sur Demander à PRISM.", "Indica primero el presupuesto, por ejemplo USD 50,000, en los detalles del proyecto o en Pregunta a PRISM."],
"Everything that could delay the project or raise its cost, how likely and how serious it is, and what you will do about it.":["كل ما قد يؤخر المشروع أو يرفع تكلفته، ومدى احتماله وخطورته، وما ستفعله حياله.", "जो कुछ भी प्रोजेक्ट में देरी या लागत बढ़ा सकता है, वह कितना संभव और गंभीर है, और आप क्या करेंगे।", "திட்டத்தைத் தாமதப்படுத்தவோ செலவை உயர்த்தவோ கூடிய அனைத்தும், அவற்றின் வாய்ப்பு, தீவிரம், நீங்கள் எடுக்கும் நடவடிக்கை.", "പ്രോജക്റ്റ് വൈകിക്കാനോ ചെലവ് കൂട്ടാനോ ഇടയുള്ളതെല്ലാം, അതിന്റെ സാധ്യതയും ഗൗരവവും, നിങ്ങൾ എന്തു ചെയ്യും എന്നതും.", "Tout ce qui pourrait retarder le projet ou augmenter son coût, sa probabilité, sa gravité et ce que vous ferez.", "Todo lo que podría retrasar el proyecto o subir su coste, su probabilidad, su gravedad y qué harás al respecto."],

"Open risks by likelihood and impact (1 = low, 5 = high). Top right is the most dangerous.":["المخاطر المفتوحة حسب الاحتمال والأثر (1 = منخفض، 5 = مرتفع). الزاوية العليا البعيدة هي الأخطر.", "संभावना और प्रभाव के अनुसार खुले जोखिम (1 = कम, 5 = अधिक)। ऊपर दाईं ओर सबसे खतरनाक।", "வாய்ப்பு மற்றும் தாக்கத்தின்படி திறந்த அபாயங்கள் (1 = குறைவு, 5 = அதிகம்). மேல் வலது மிக ஆபத்தானது.", "സാധ്യതയും ആഘാതവും അനുസരിച്ച് തുറന്ന റിസ്കുകൾ (1 = കുറവ്, 5 = കൂടുതൽ). മുകളിൽ വലത് ഏറ്റവും അപകടകരം.", "Risques ouverts par probabilité et impact (1 = faible, 5 = élevé). En haut à droite : les plus dangereux.", "Riesgos abiertos por probabilidad e impacto (1 = bajo, 5 = alto). Arriba a la derecha, los más peligrosos."],

"1 rare · 2 unlikely · 3 possible · 4 likely · 5 almost certain.":["1 نادر · 2 غير مرجح · 3 ممكن · 4 مرجح · 5 شبه مؤكد.", "1 दुर्लभ · 2 असंभावित · 3 संभव · 4 संभावित · 5 लगभग निश्चित।", "1 அரிது · 2 வாய்ப்பு குறைவு · 3 சாத்தியம் · 4 வாய்ப்பு அதிகம் · 5 கிட்டத்தட்ட உறுதி.", "1 അപൂർവം · 2 സാധ്യത കുറവ് · 3 സാധ്യം · 4 സാധ്യത കൂടുതൽ · 5 ഏതാണ്ട് ഉറപ്പ്.", "1 rare · 2 improbable · 3 possible · 4 probable · 5 presque certain.", "1 raro · 2 improbable · 3 posible · 4 probable · 5 casi seguro."],
"Review open risks every week and close the ones that can no longer happen. High risks appear in the Project Document and the Final Report.":["راجع المخاطر المفتوحة كل أسبوع وأغلق التي لم تعد ممكنة. تظهر المخاطر في مستند المشروع والتقرير النهائي.", "हर हफ्ते खुले जोखिम देखें और जो अब नहीं हो सकते उन्हें बंद करें। जोखिम प्रोजेक्ट दस्तावेज़ और अंतिम रिपोर्ट में दिखते हैं।", "ஒவ்வொரு வாரமும் திறந்த அபாயங்களை மதிப்பாய்வு செய்து, இனி நடக்க முடியாதவற்றை மூடுங்கள். அபாயங்கள் திட்ட ஆவணத்திலும் இறுதி அறிக்கையிலும் தோன்றும்.", "എല്ലാ ആഴ്ചയും തുറന്ന റിസ്കുകൾ പരിശോധിച്ച് ഇനി സംഭവിക്കാത്തവ അടയ്ക്കുക. റിസ്കുകൾ പ്രോജക്റ്റ് ഡോക്യുമെന്റിലും അന്തിമ റിപ്പോർട്ടിലും കാണും.", "Revoyez les risques ouverts chaque semaine et fermez ceux qui ne peuvent plus arriver. Les risques figurent dans le document de projet et le rapport final.", "Revisa los riesgos abiertos cada semana y cierra los que ya no pueden ocurrir. Los riesgos aparecen en el documento del proyecto y el informe final."],

"No risks yet. Add one, or let PRISM suggest risks for this kind of project.":["لا مخاطر بعد. أضف واحدًا أو دع PRISM يقترح مخاطر لهذا النوع من المشاريع.", "अभी कोई जोखिम नहीं। एक जोड़ें, या PRISM को इस तरह के प्रोजेक्ट के लिए जोखिम सुझाने दें।", "இன்னும் அபாயங்கள் இல்லை. ஒன்றைச் சேர்க்கவும், அல்லது இவ்வகைத் திட்டத்துக்கான அபாயங்களை PRISM பரிந்துரைக்கட்டும்.", "ഇതുവരെ റിസ്കുകളില്ല. ഒന്ന് ചേർക്കുക, അല്ലെങ്കിൽ PRISM നിർദ്ദേശിക്കട്ടെ.", "Aucun risque pour l'instant. Ajoutez-en un ou laissez PRISM en suggérer.", "Aún no hay riesgos. Añade uno o deja que PRISM los sugiera."],

"This project asks team members to sign in. Your name is shown on the changes you make.":["يطلب هذا المشروع من أعضاء الفريق تسجيل الدخول. يظهر اسمك على التغييرات التي تجريها.", "यह प्रोजेक्ट टीम सदस्यों से साइन इन करने को कहता है। आपके बदलावों पर आपका नाम दिखेगा।", "இந்தத் திட்டம் குழு உறுப்பினர்களை உள்நுழையச் சொல்கிறது. உங்கள் மாற்றங்களில் உங்கள் பெயர் தெரியும்.", "ഈ പ്രോജക്റ്റിൽ ടീം അംഗങ്ങൾ സൈൻ ഇൻ ചെയ്യണം. നിങ്ങളുടെ മാറ്റങ്ങളിൽ പേര് കാണിക്കും.", "Ce projet demande aux membres de se connecter. Votre nom apparaît sur vos modifications.", "Este proyecto pide a los miembros iniciar sesión. Tu nombre aparece en tus cambios."],
"Sign in so your name is shown on the changes you make and My tasks opens with your tasks.":["سجّل الدخول ليظهر اسمك على تغييراتك وتفتح صفحة مهامي على مهامك.", "साइन इन करें ताकि आपके बदलावों पर आपका नाम दिखे और मेरे कार्य आपके कार्यों के साथ खुले।", "உள்நுழைந்தால் உங்கள் மாற்றங்களில் பெயர் தெரியும், என் பணிகள் உங்கள் பணிகளுடன் திறக்கும்.", "സൈൻ ഇൻ ചെയ്താൽ മാറ്റങ്ങളിൽ പേര് കാണിക്കും, എന്റെ ടാസ്കുകൾ നിങ്ങളുടേത് കാണിക്കും.", "Connectez-vous pour que votre nom apparaisse sur vos modifications et que Mes tâches s'ouvre sur vos tâches.", "Inicia sesión para que tu nombre aparezca en tus cambios y Mis tareas muestre tus tareas."],

"Forgot your PIN? Ask the project manager to reset it on Ask PRISM.":["نسيت رمزك؟ اطلب من مدير المشروع إعادة تعيينه في اسأل PRISM.", "PIN भूल गए? प्रोजेक्ट मैनेजर से Ask PRISM पर रीसेट करने को कहें।", "PIN மறந்துவிட்டதா? PRISM-இடம் கேள் பக்கத்தில் மீட்டமைக்க திட்ட மேலாளரிடம் கேளுங்கள்.", "PIN മറന്നോ? Ask PRISM-ൽ റീസെറ്റ് ചെയ്യാൻ പ്രോജക്റ്റ് മാനേജരോട് പറയുക.", "Code oublié ? Demandez au chef de projet de le réinitialiser sur Demander à PRISM.", "¿Olvidaste tu PIN? Pide al jefe de proyecto que lo restablezca en Pregunta a PRISM."],
"With a PIN, nobody else can sign in with your name. Leave it empty to skip.":["مع الرمز السري لا يستطيع أحد غيرك الدخول باسمك. اتركه فارغًا للتخطي.", "PIN के साथ कोई और आपके नाम से साइन इन नहीं कर सकता। छोड़ने के लिए खाली रखें।", "PIN இருந்தால் வேறு யாரும் உங்கள் பெயரில் உள்நுழைய முடியாது. தவிர்க்க காலியாக விடவும்.", "PIN ഉണ്ടെങ്കിൽ മറ്റാർക്കും നിങ്ങളുടെ പേരിൽ സൈൻ ഇൻ ചെയ്യാനാവില്ല. ഒഴിവാക്കാൻ ശൂന്യമാക്കി വിടുക.", "Avec un code PIN, personne d'autre ne peut se connecter sous votre nom. Laissez vide pour passer.", "Con un PIN nadie más puede entrar con tu nombre. Déjalo vacío para omitirlo."],
"This is a simple team sign-in, not a bank-grade password. Anyone with the project file or link can still read the project.":["هذا تسجيل دخول بسيط للفريق وليس كلمة مرور بمستوى البنوك. من لديه ملف المشروع أو الرابط يمكنه قراءته.", "यह सरल टीम साइन-इन है, बैंक जैसा पासवर्ड नहीं। प्रोजेक्ट फ़ाइल या लिंक वाला कोई भी इसे पढ़ सकता है।", "இது எளிய குழு உள்நுழைவு, வங்கி அளவிலான கடவுச்சொல் அல்ல. திட்டக் கோப்பு அல்லது இணைப்பு உள்ள எவரும் திட்டத்தைப் படிக்கலாம்.", "ഇത് ലളിതമായ ടീം സൈൻ-ഇൻ ആണ്, ബാങ്ക് നിലവാരമുള്ള പാസ്‌വേഡ് അല്ല. ഫയലോ ലിങ്കോ ഉള്ളവർക്ക് പ്രോജക്റ്റ് വായിക്കാം.", "C'est une connexion d'équipe simple, pas un mot de passe bancaire. Toute personne ayant le fichier ou le lien peut lire le projet.", "Es un inicio de sesión sencillo, no una contraseña bancaria. Quien tenga el archivo o el enlace puede leer el proyecto."],

"Phone (with country code) and email are used for reminders. Hourly rate is used by the Timesheet to work out labour cost.":["يُستخدم الهاتف (مع رمز الدولة) والبريد للتذكيرات. ويُستخدم أجر الساعة في سجل الوقت لحساب تكلفة العمل.", "फ़ोन (देश कोड सहित) और ईमेल रिमाइंडर के लिए हैं। घंटे की दर से टाइमशीट श्रम लागत निकालती है।", "தொலைபேசி (நாட்டுக் குறியீட்டுடன்) மற்றும் மின்னஞ்சல் நினைவூட்டல்களுக்கு. மணிநேரக் கட்டணம் நேரத்தாளில் உழைப்புச் செலவைக் கணக்கிடும்.", "ഫോൺ (കൺട്രി കോഡോടെ), ഇമെയിൽ എന്നിവ ഓർമ്മപ്പെടുത്തലിന്. മണിക്കൂർ നിരക്ക് ടൈംഷീറ്റിൽ തൊഴിൽ ചെലവ് കണക്കാക്കാൻ.", "Le téléphone (avec indicatif) et l'e-mail servent aux rappels. Le taux horaire sert à la feuille de temps pour le coût de main-d'œuvre.", "El teléfono (con prefijo) y el correo se usan para recordatorios. La tarifa por hora la usa la hoja de horas para el coste."],

"PRISM fills these in when the task starts and when it is marked Done. You can correct them.":["يملأ PRISM هذه عند بدء المهمة وعند تعليمها كمنجزة. يمكنك تصحيحها.", "कार्य शुरू होने और पूरा चिह्नित होने पर PRISM इन्हें भरता है। आप इन्हें सुधार सकते हैं।", "பணி தொடங்கும்போதும் முடிந்ததாகக் குறிக்கும்போதும் PRISM இவற்றை நிரப்பும். நீங்கள் திருத்தலாம்.", "ടാസ്ക് തുടങ്ങുമ്പോഴും പൂർത്തിയാക്കുമ്പോഴും PRISM ഇവ പൂരിപ്പിക്കും. നിങ്ങൾക്ക് തിരുത്താം.", "PRISM les remplit quand la tâche démarre et quand elle est terminée. Vous pouvez les corriger.", "PRISM las rellena cuando la tarea empieza y cuando se marca como hecha. Puedes corregirlas."],

"Files up to 500 KB are stored inside the project. For bigger files, add a link to Drive or OneDrive.":["تُحفظ الملفات حتى 500 كيلوبايت داخل المشروع. للملفات الأكبر أضف رابطًا إلى Drive أو OneDrive.", "500 KB तक की फ़ाइलें प्रोजेक्ट में रहती हैं। बड़ी फ़ाइलों के लिए Drive या OneDrive का लिंक जोड़ें।", "500 KB வரையிலான கோப்புகள் திட்டத்துக்குள் சேமிக்கப்படும். பெரிய கோப்புகளுக்கு Drive அல்லது OneDrive இணைப்பைச் சேர்க்கவும்.", "500 KB വരെയുള്ള ഫയലുകൾ പ്രോജക്റ്റിനുള്ളിൽ സൂക്ഷിക്കും. വലിയവയ്ക്ക് Drive/OneDrive ലിങ്ക് ചേർക്കുക.", "Les fichiers jusqu'à 500 Ko sont stockés dans le projet. Pour les plus gros, ajoutez un lien Drive ou OneDrive.", "Los archivos de hasta 500 KB se guardan en el proyecto. Para los más grandes, añade un enlace de Drive u OneDrive."],
"That file is bigger than 500 KB. Upload it to Drive or OneDrive and add the link instead.":["الملف أكبر من 500 كيلوبايت. ارفعه إلى Drive أو OneDrive وأضف الرابط بدلًا منه.", "यह फ़ाइल 500 KB से बड़ी है। इसे Drive या OneDrive पर अपलोड करके लिंक जोड़ें।", "இந்தக் கோப்பு 500 KB-ஐ விடப் பெரியது. Drive அல்லது OneDrive-இல் பதிவேற்றி இணைப்பைச் சேர்க்கவும்.", "ഈ ഫയൽ 500 KB-യിൽ കൂടുതലാണ്. Drive/OneDrive-ൽ അപ്‌ലോഡ് ചെയ്ത് ലിങ്ക് ചേർക്കുക.", "Ce fichier dépasse 500 Ko. Mettez-le sur Drive ou OneDrive et ajoutez le lien.", "El archivo supera 500 KB. Súbelo a Drive u OneDrive y añade el enlace."],

    if (!el || el.closest("textarea,script,style,.msg,.paper,.notr")) continue;
    if (!ORIG.has(n)) ORIG.set(n, n.nodeValue);

    const out = core ? tlS(core) : null;

  root.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el => {

/* ---------- scheduling: forward/backward pass, finish-to-start ---------- */
function schedule(){
  CAL = calFor(S.project);
  const byId = new Map(S.tasks.map(t=>[t.id,t]));
  const warnings = [];
  const order = []; const mark = new Map(); let cycle = false;
  const visit = (t, path) => {
    if (mark.get(t.id) === 2) return;
    if (mark.get(t.id) === 1) { cycle = true; warnings.push("Circular dependency: " + [...path, t.id].join(" → ")); return; }
    mark.set(t.id,1);
    for (const p of t.preds||[]) { const pt = byId.get(p); if (pt) visit(pt, [...path, t.id]); }
    mark.set(t.id,2); order.push(t);
  };
  for (const t of S.tasks) visit(t, []);
  for (const t of S.tasks) for (const p of t.preds||[]) if (!byId.has(p)) warnings.push(`${t.id} lists predecessor "${p}", which does not exist.`);
  const R = new Map();
  for (const t of order) {
    const dur = Math.max(0, +t.dur||0);
    let es = d2n(t.start) ?? d2n(S.project.start) ?? TODAY;
    for (const p of t.preds||[]) { const r = R.get(p); if (r) es = Math.max(es, r.ef + 1); }
    es = nextWork(es);
    const ef = dur > 0 ? addWork(es, dur) : es - 1;
    R.set(t.id, {es, ef, dur, milestone: dur===0});
  }
  const succ = new Map(S.tasks.map(t=>[t.id,[]]));
  for (const t of S.tasks) for (const p of t.preds||[]) if (succ.has(p)) succ.get(p).push(t.id);
  let end = -Infinity, cpEnd = -Infinity, start = Infinity;
  for (const r of R.values()) { end = Math.max(end, r.ef, r.es); cpEnd = Math.max(cpEnd, r.ef); start = Math.min(start, r.es); }
  for (const t of [...order].reverse()) {
    const r = R.get(t.id); if (!r) continue;
    let lf = cpEnd;
    for (const s of succ.get(t.id)) { const sr = R.get(s); if (sr && sr.ls !== undefined) lf = Math.min(lf, sr.ls - 1); }
    if (r.dur > 0) { lf = prevWork(lf); r.lf = lf; r.ls = subWork(lf, r.dur); } else { r.lf = lf; r.ls = nextWork(lf + 1); }
    r.slack = workBetween(r.es, r.ls); r.critical = !cycle && r.slack <= 0;
    r.succ = succ.get(t.id);
    const span = Math.max(1, r.dur);
    r.expected = r.milestone ? (TODAY >= r.es ? 100 : 0) : clamp(Math.round(workBetween(r.es, TODAY + 1) / span * 100), 0, 100);
    const p = +t.progress||0;
    r.overdue = p < 100 && TODAY > r.ef && !r.milestone || (r.milestone && p<100 && TODAY > r.es);
    r.behind = p < 100 && r.expected - p >= 15;
  }
  return {R, warnings, start: isFinite(start)?start:TODAY, end: isFinite(end)?end:TODAY, succ};
}

const xe = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function wRun(text, opt={}){

/* ---------- PDF export with jsPDF ---------- */
function buildPdf(docKey){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt", format:"a4"});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 56, CW = W - 2*M;
  const TEAL = [14,95,89], INK = [27,33,41], GREY = [91,100,114], HINT = [138,147,160];
  const clean = s => String(s ?? "").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,"-").replace(/→/g,"->").replace(/…/g,"...").replace(/•/g,"-").replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g,"");
  let y = M;
  const need = h => { if (y + h > H - M) { pdf.addPage(); y = M; } };
  const text = (str, opt) => {
    pdf.setFont("helvetica", opt.style||"normal"); pdf.setFontSize(opt.size||10.5); pdf.setTextColor(...(opt.color||INK));
    for (const para of clean(str).split("\n")) {
      const bullet = /^\s*-\s+/.test(para);
      const lines = pdf.splitTextToSize(bullet ? para.replace(/^\s*-\s+/,"") : (para||" "), CW - (bullet?14:0));
      lines.forEach((ln,i) => { need(opt.lh||15); if (bullet && i===0) pdf.text("•", M+2, y); pdf.text(ln, M + (bullet?14:0), y); y += opt.lh||15; });
    }
  };
  for (const b of docBlocks(docKey)) {
    if (b.t==="title") {
      pdf.setDrawColor(...TEAL); pdf.setLineWidth(2.5); pdf.line(M, y+8, W-M, y+8);
      pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5); pdf.setTextColor(...TEAL); pdf.text("PRISM", M, y);
      pdf.setTextColor(...GREY); pdf.text(clean(TEMPLATES[docKey].name.toUpperCase()), W-M, y, {align:"right"});
      y += 46; text(b.text, {style:"bold", size:24, color:TEAL, lh:28}); y += 2; text(b.sub, {size:11.5, color:GREY}); y += 8;
    } else if (b.t==="h1") { y += 10; need(40); text(b.text, {style:"bold", size:13.5, color:TEAL, lh:19}); y += 2; }
    else if (b.t==="p") { text(b.text, {}); y += 4; }
    else if (b.t==="hint") { text(b.text, {style:"italic", color:HINT}); y += 4; }
    else if (b.t==="table") {
      pdf.autoTable({startY:y, head:[b.head.map(clean)], body:b.rows.map(r=>r.map(clean)), margin:{left:M,right:M}, theme:"grid",
        styles:{font:"helvetica", fontSize:9, textColor:INK, lineColor:[207,214,223], lineWidth:.5, cellPadding:4, minCellHeight: b.head[2]==="Signature"?24:0},
        headStyles:{fillColor:TEAL, textColor:255, fontStyle:"bold"}});
      y = pdf.lastAutoTable.finalY + 12;
    } else if (b.t==="bars") {
      pdf.setFontSize(9);
      for (const i of b.items) {
        need(18);
        pdf.setFont("helvetica","normal"); pdf.setTextColor(...INK);
        let lab = clean(i.label); while (pdf.getTextWidth(lab) > 160 && lab.length > 4) lab = lab.slice(0,-2);
        if (lab !== clean(i.label)) lab = lab.trim()+"...";
        pdf.text(lab, M, y);
        const bx = M+170, bw = CW-170-40;
        pdf.setFillColor(230,234,239); pdf.rect(bx, y-8, bw, 9, "F");
        pdf.setFillColor(42,120,214); if (i.value>0) pdf.rect(bx, y-8, bw*i.value/100, 9, "F");
        pdf.setDrawColor(...INK); pdf.setLineWidth(1.2); const ex = bx + bw*i.expected/100; pdf.line(ex, y-11, ex, y+3);
        pdf.text(i.value+"%", W-M, y, {align:"right"});
        y += 17;
      }
      text(tl("Bar = actual progress. Black tick = progress planned for today."), {style:"italic", size:8.5, color:HINT, lh:12}); y += 8;
    }
  }
  const n = pdf.getNumberOfPages();
  for (let p=1; p<=n; p++) { pdf.setPage(p); pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(...HINT);
    pdf.text(clean(`${S.project.name} · ${TEMPLATES[docKey].name}`).replace(/·/g,"-"), M, H-28); pdf.text(`Page ${p} of ${n}`, W-M, H-28, {align:"right"}); }
  return pdf.output("arraybuffer");
}

function buildGanttPdf(){

function importXlsx(buf){
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const ws = wb.Sheets["Tasks"] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:"", raw:true});
  const pick = (row, name) => { const key = Object.keys(row).find(k => k.trim().toLowerCase() === name.toLowerCase()); return key ? row[key] : ""; };
  const toDate = v => v instanceof Date ? n2d(Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())/DAY)) : (typeof v==="number" ? n2d(Math.round(v) - 25569) : (d2n(String(v).trim()) != null ? String(v).trim() : ""));
  const tasks = [], seen = new Set();
  for (const row of rows) {
    const id = String(pick(row,"ID")).trim().toUpperCase(); if (!id || seen.has(id)) continue; seen.add(id);
    const old = S.tasks.find(t=>t.id===id) || {};
    let progress = clamp(Math.round(+pick(row,"Progress %")||0),0,100);
    let status = String(pick(row,"Status")).trim(); if (!STATUSES.includes(status)) status = progress>=100 ? "Done" : progress>0 ? "In progress" : "Not started";
    if (status==="Done") progress = 100;
    const pr = String(pick(row,"Priority")).trim();
    tasks.push({id, name:String(pick(row,"Task")||old.name||id), owner:String(pick(row,"Owner")||""), start: toDate(pick(row,"Earliest start")) || old.start || S.project.start || n2d(TODAY),
      dur: Math.max(0, Math.round(+pick(row,"Duration (days)")||0)), preds: parsePreds(pick(row,"Predecessors")).filter(p=>p!==id), progress, status, priority:["High","Medium","Low"].includes(pr)?pr:"Medium"});
  }
  if (!tasks.length) throw new Error("no task rows found on the Tasks sheet");
  for (const t of tasks) t.preds = t.preds.filter(p => seen.has(p));
  return tasks;
}


/* Image-based PDF: used when the text is not in a Latin script (Arabic, Hindi, Tamil, Malayalam…) or the page is translated,
   because the browser draws those scripts correctly while the built-in PDF fonts cannot. */
function inlineSvgStyles(doc){
  doc.querySelectorAll("svg, svg *").forEach(el => {
    const cs = doc.defaultView.getComputedStyle(el);
    if (el.tagName.toLowerCase() !== "svg") {
      if (cs.fill) el.setAttribute("fill", cs.fill);
      if (cs.stroke && cs.stroke !== "none") el.setAttribute("stroke", cs.stroke);
      if (cs.opacity && cs.opacity !== "1") el.setAttribute("opacity", cs.opacity);
    }
    if (/^(text|tspan|svg)$/i.test(el.tagName)) { el.setAttribute("font-family", cs.fontFamily); if (el.tagName.toLowerCase() !== "svg") { el.setAttribute("font-size", cs.fontSize); el.setAttribute("font-weight", cs.fontWeight); } }
    el.removeAttribute("style");
  });
}
async function imagePdf(el, orientation, prep){
  if (!window.html2canvas) throw new Error("PDF engine did not load");
  toast(tl("Making the PDF…"));
  const root = document.documentElement, prev = root.getAttribute("data-theme");
  root.setAttribute("data-theme", "light");
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  let canvas;
  try {
    canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", logging:false, onclone: doc => { if (prep) prep(doc); inlineSvgStyles(doc); }});
  } finally { if (prev === null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prev); }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:"pt", format:"a4", orientation});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 28;
  const cw = W - 2*M, scale = cw / canvas.width, pageH = Math.floor((H - 2*M) / scale);
  for (let y = 0, i = 0; y < canvas.height; y += pageH, i++) {
    const h = Math.min(pageH, canvas.height - y), part = document.createElement("canvas");
    part.width = canvas.width; part.height = h; const ctx = part.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, part.width, h); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if (i) pdf.addPage();
    pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", M, M, cw, h * scale);
  }
  return pdf.output("arraybuffer");
}

const roleWords = r => String(r||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(w => w.length > 2 && !/^(and|the|of|for|lead|senior|junior|team)$/.test(w)).map(w => w.replace(/(ers|er|ists|ist|s)$/, ""));
function sameRole(a, b){ const x = String(a||"").trim().toLowerCase(), y = String(b||"").trim().toLowerCase(); return !!x && x === y; }
function roleScore(a, b){ const A = roleWords(a), B = new Set(roleWords(b)); return A.filter(w => B.has(w)).length; }
const isPM = r => /manag|^pm$|chef de projet|jefe de proyecto|مدير|प्रबंधक|மேலாளர்|മാനേജർ/i.test(String(r||""));
// Gives every task to a team member: same role first, then the closest role, then whoever has the least work.
function assignOwners(tasks, team, project){
  const ppl = (team||[]).filter(m => m.name && m.name.trim()); if (!ppl.length) return 0;
  const load = new Map(ppl.map(m => [m.name, 0])); let n = 0;
  for (const t of tasks) if (load.has(t.owner)) load.set(t.owner, load.get(t.owner) + (+t.dur||0));
  for (const t of tasks) {
    if (load.has(t.owner)) continue;
    let best = null, bs = 0;
    for (const m of ppl) { const sc = sameRole(t.owner, m.role) ? 99 : roleScore(t.owner, m.role) + (isPM(t.owner) && isPM(m.role) ? 5 : 0); if (sc > bs || (sc === bs && sc > 0 && load.get(m.name) < load.get(best.name))) { best = m; bs = sc; } }
    if (!best) { const pool = ppl.filter(m => !isPM(m.role)).length ? ppl.filter(m => !isPM(m.role)) : ppl; best = pool.reduce((a, m) => load.get(m.name) < load.get(a.name) ? m : a, pool[0]); }
    t.owner = best.name; load.set(best.name, load.get(best.name) + (+t.dur||0)); n++;
  }
  const pm = ppl.find(m => isPM(m.role));
  if (pm && project && (!project.manager || /^\[/.test(project.manager))) project.manager = pm.name;
  return n;
}

function ganttSvg(sched){
  const {R} = sched;
  const start = Math.min(sched.start, TODAY) - 2, end = Math.max(sched.end, TODAY) + Math.ceil(90/zoom) + 2;
  const days = end - start + 1, LW = 210, RH = 34, TH = 46, DW = zoom;
  const width = LW + days*DW + 10, height = TH + S.tasks.length*RH + 24;
  const x = n => LW + (n - start)*DW;
  let g = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Gantt chart" style="font-family:var(--f-body)">
    <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--fg-2)"/></marker></defs>
    <rect x="0" y="0" width="${width}" height="${height}" fill="var(--surface)"/>`;
  // header: months + days/weeks
  let curM = null;
  for (let n=start; n<=end; n++) {
    const d = new Date(n*DAY), dow = d.getUTCDay(), dom = d.getUTCDate();
    if (CAL && CAL.any ? !isWorkDay(n) : (dow===0 || dow===6)) g += `<rect x="${x(n)}" y="${TH}" width="${DW}" height="${height-TH}" fill="var(--surface-2)"/>`;
    const mk = d.getUTCFullYear()*12 + d.getUTCMonth();
    if (mk !== curM) { curM = mk; g += `<line x1="${x(n)}" y1="0" x2="${x(n)}" y2="${height}" stroke="var(--line)"/><text x="${x(n)+5}" y="17" font-size="11.5" font-weight="700" fill="var(--fg)">${d.toLocaleDateString(LOC(),{month:"short",year:"numeric",timeZone:"UTC"})}</text>`; }
    if (DW >= 18) g += `<text x="${x(n)+DW/2}" y="37" font-size="10" text-anchor="middle" fill="var(--fg-3)">${dom}</text>`;
    else if (dow===1) g += `<line x1="${x(n)}" y1="${TH-14}" x2="${x(n)}" y2="${height}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(n)+3}" y="37" font-size="10" fill="var(--fg-3)">${dom}</text>`;
  }
  g += `<line x1="0" y1="${TH}" x2="${width}" y2="${TH}" stroke="var(--line)"/><line x1="${LW}" y1="0" x2="${LW}" y2="${height}" stroke="var(--line)"/>`;
  g += `<text x="12" y="37" font-size="10.5" font-weight="700" fill="var(--fg-3)" letter-spacing=".06em">TASK</text>`;

    const nm = (t.id + "  " + t.name); const short = nm.length > 30 ? nm.slice(0,29)+"…" : nm;
    g += `<text x="12" y="${yy+21}" font-size="12.5" fill="var(--fg)"><tspan font-family="var(--f-mono)" fill="var(--fg-3)" font-size="11">${esc(t.id)}</tspan>  ${esc(short.slice(t.id.length+2))}</text>`;
    if (!r) return;
    const bl = baselineOf(t);
    if (bl && bl.s != null) g += `<rect x="${x(bl.s)+1}" y="${yy+RH-7}" width="${Math.max(3,(bl.f-bl.s+1)*DW-2)}" height="4" rx="2" fill="var(--fg-3)" opacity=".6" data-tip="${esc(tl("Baseline")+"|"+fmt(bl.s)+" → "+fmt(bl.f))}"/>`;
    const tip = `${t.id} ${t.name}|${fmt(r.es)} → ${fmt(r.milestone?r.es:r.ef)} (${r.dur})|${tl("Owner: {o} · Progress {n}%",{o:t.owner||"–", n:+t.progress||0})}|${tl("Predecessors: {p} · Successors: {s}",{p:(t.preds||[]).join(", ")||"–", s:(r.succ||[]).join(", ")||"–"})}|${tl(r.critical?"Slack: {n} days · on critical path":"Slack: {n} days",{n:r.slack})}`;

  return g + `</svg>`;
}

function stats(sched){
  const {R} = sched; const ts = S.tasks;
  let w=0, wp=0, we=0;
  for (const t of ts) { const r = R.get(t.id); const d = Math.max(1, +t.dur||0); w+=d; wp+=d*(+t.progress||0); we+=d*(r?r.expected:0); }
  return { total:ts.length, done:ts.filter(t=>t.status==="Done"||+t.progress>=100).length,
    overall: w?Math.round(wp/w):0, expected: w?Math.round(we/w):0,
    overdue: ts.filter(t=>R.get(t.id)?.overdue).length, behind: ts.filter(t=>R.get(t.id)?.behind).length };
}

function chartProgress(sched){
