  const team = topicDraft.team.filter(m => m.name && m.name.trim()).map(m => ({name:m.name.trim(), role:(m.role||"").trim(), group:(m.group||"").trim()}));
  const pmMember = team.find(m => isPM(m.role));
  const manager = pmMember ? pmMember.name : "[Project manager]";
  const extra = [topicDraft.category ? "Category: " + topicDraft.category : "", topicDraft.budget ? "Budget: " + topicDraft.budget : "", topicDraft.deadline ? "Deadline: " + topicDraft.deadline + " (plan durations so the project can finish by this date if realistic)" : "",
    team.length ? "Team members (set each task's owner to one of these people, using the name exactly, matching the role): " + team.map(m => m.name + (m.role ? " (" + m.role + ")" : "")).join("; ") : ""].filter(Boolean).join("\n");
  try {
    setBuild(tl("Step 1 of 4: planning tasks and dependencies…"));
    const plan = await sample.json(`You are PRISM, a project-management assistant. Plan a realistic project for this topic.
Topic: ${topic}
${details ? "Extra details from the user: " + details + "\n" : ""}${extra ? extra + "\n" : ""}Project start date: ${start}
Reply with only a JSON object of this shape:
{"project":{"name":"short project name","code":"SHORT-CODE","client":"client or department","sponsor":"sponsor role","budget":"estimated budget with currency","category":"one of: Software / IT, Construction, Engineering, Event, Marketing, Research, Education, Healthcare, Other","description":"2 sentences"},
 "tasks":[{"id":"T1","name":"task name","owner":"role","durationDays":5,"predecessors":[],"priority":"High"}]}
${LANG!=="en" ? `Write the project name, client, sponsor, budget text, description, task names and owner roles in ${langInfo().name}. Keep JSON keys, IDs and priority values (High, Medium, Low) in English.\n` : ""}Rules: 10 to 16 tasks covering the full life cycle for this kind of project (initiation, planning, design, execution, testing or inspection, handover), with names specific to the topic. IDs T1, T2, ... in order. Predecessors are IDs of earlier tasks; include parallel branches, not one straight chain. durationDays in calendar days, 1 to 30. The last task is a 0-day milestone such as Go-live, Handover or Completion. Owners are realistic roles for this field (for example Site Engineer, Developer, QA Lead); reuse roles across tasks. priority is High, Medium or Low.`, {modelTier:"default"});
    const P = (plan && plan.project) || {};
    const raw = Array.isArray(plan && plan.tasks) ? plan.tasks.slice(0,30) : [];
    if (!raw.length) throw {code:"no_plan"};
    const idMap = new Map(); raw.forEach((t,i)=>idMap.set(String(t.id ?? ("T"+(i+1))), "T"+(i+1)));
    const tasks = raw.map((t,i)=>{
      const id = "T"+(i+1);
      const preds = (Array.isArray(t.predecessors)?t.predecessors:[]).map(p=>idMap.get(String(p))).filter(p=>p && +p.slice(1) < i+1);
      return {id, name:String(t.name||("Task "+(i+1))).slice(0,120), owner:String(t.owner||"").slice(0,40), start, dur:clamp(Math.round(+t.durationDays||0),0,120), preds:[...new Set(preds)], progress:0, status:"Not started", priority:["High","Medium","Low"].includes(t.priority)?t.priority:"Medium"};
    });
    const NS = {example:false, docLang:LANG, topic, project:{name:String(P.name||topic).slice(0,100), code:String(P.code||"").slice(0,30), manager, client:String(P.client||""), sponsor:String(P.sponsor||""), start, budget:String(topicDraft.budget||P.budget||""), category:topicDraft.category||(CATEGORIES.includes(P.category)?P.category:""), deadline:topicDraft.deadline||"", description:String(P.description||"")}, tasks, docs:{}, chat:[]};
    for (const k of Object.keys(TEMPLATES)) NS.docs[k] = {version:k==="report"?"0.1":"1.0", status:"Draft", sections:{}};
    NS.team = team; assignOwners(NS.tasks, team, NS.project);
    addProject(NS); render();
    const data = {topic, ...contextPacket()};
    const names = {projdoc:"Project Document", techdoc:"Technical Document", report:"Final Report"};
    let step = 2, failed = [];
    for (const k of Object.keys(TEMPLATES)) {
      setBuild(tl("Step {n} of 4: writing the {doc}…", {n:step++, doc:tl(names[k])}));
      try { await draftDoc(sample, k, {target:NS, data}); save(); } catch(e) { failed.push(names[k]); if (e && e.code==="not_granted") break; }
    }
    building = false;
    const end = schedule();
    const done = tl("Built \"{name}\": {n} tasks, finishing {date}.", {name:NS.project.name, n:tasks.length, date:fmt(end.end)}) + " " + (failed.length ? tl("Could not write: {list}. Use \"Draft empty sections with AI\" on that page to try again.", {list:failed.map(f=>tl(f)).join(", ")}) : tl("All three documents are drafted."));
    NS.chat.push({role:"assistant", content: done + "\n" + tl("Open Gantt Chart to see the dependencies, Task Tracking for the charts, and the document pages to review and download. Ask me anything about this project.")});
    save(); setBuild(done); render(); toast(tl("New project ready: {name}", {name:NS.project.name}));
  } catch(e) {
    building = false;
    setBuild(e && e.code==="no_plan" ? tl("PRISM could not plan that topic. Try wording it differently.") : errCopy(e));
  }
}

let relocBusy = false;
async function relocalize(){
  if (relocBusy) return;
  const E = window.PRISM_ENGINE, ai = (window.PRISM_AI || {}).ai, to = langInfo();
  if (E && E.relocalize && ai !== "claude") {

  }
  const sample = await cap("sample");
  if (!sample) { toast(tl("PRISM could not answer just now. Try again in a moment.")); return; }
  relocBusy = true; toast(tl("Translating the documents into {to}…", {to:to.label}));
  try {
    const docs = {}; for (const [k, d] of Object.entries(S.docs)) { const o = {}; for (const [sk, v] of Object.entries(d.sections || {})) if (String(v || "").trim()) o[sk] = v; docs[k] = o; }
    const payload = {project:{client:S.project.client, sponsor:S.project.sponsor, budget:S.project.budget, description:S.project.description}, tasks:S.tasks.map(t => ({id:t.id, name:t.name, owner:t.owner})), docs};
    const out = await sample.json(`Translate every text value in this JSON into ${to.name}. Keep exactly the same JSON shape, keys and IDs. Keep numbers, dates, currency codes, line breaks, "- " bullets and [confirm] markers. Keep people's personal names unchanged. Reply with only the JSON.\n\n${JSON.stringify(payload)}`);
    if (!out || typeof out !== "object") throw {code:"bad_json"};
    const P = out.project || {}; for (const f of ["client", "sponsor", "budget", "description"]) if (typeof P[f] === "string" && P[f].trim()) S.project[f] = P[f];
    for (const t of (Array.isArray(out.tasks) ? out.tasks : [])) { const x = S.tasks.find(y => y.id === t.id); if (!x) continue; if (typeof t.name === "string" && t.name.trim()) x.name = t.name.slice(0, 120); if (typeof t.owner === "string") x.owner = t.owner.slice(0, 40); }
    for (const [k, secs] of Object.entries(out.docs || {})) if (S.docs[k] && secs && typeof secs === "object") for (const [sk, v] of Object.entries(secs)) if (typeof v === "string" && sk in docs[k]) S.docs[k].sections[sk] = v;
    S.docLang = LANG; S.example = false; save(); render(); toast(tl("Documents rewritten in {to}.", {to:to.label}));
  } catch(e) { toast(errCopy(e)); }
  finally { relocBusy = false; }
}

/* ---------- working days (weekends and holidays) ---------- */
let CAL = null; // calendar of the project being scheduled
function calFor(p){
  let wk = new Set(((p && p.weekend) || []).map(Number));
  if (wk.size >= 7) wk = new Set();
  const hol = new Set(((p && p.holidays) || []).map(d2n).filter(n => n != null));
  return {wk, hol, any: wk.size > 0 || hol.size > 0};
}
const isWorkDay = (n, c = CAL) => !c || !c.any || (!c.wk.has(new Date(n*DAY).getUTCDay()) && !c.hol.has(n));
function nextWork(n, c = CAL){ let i = 0; while (!isWorkDay(n, c) && i++ < 800) n++; return n; }
function prevWork(n, c = CAL){ let i = 0; while (!isWorkDay(n, c) && i++ < 800) n--; return n; }
function addWork(es, dur, c = CAL){ if (!c || !c.any) return es + dur - 1; let ef = es, k = 1, i = 0; while (k < dur && i++ < 5000) { ef++; if (isWorkDay(ef, c)) k++; } return ef; }
function subWork(lf, dur, c = CAL){ if (!c || !c.any) return lf - dur + 1; let ls = lf, k = 1, i = 0; while (k < dur && i++ < 5000) { ls--; if (isWorkDay(ls, c)) k++; } return ls; }
function workBetween(a, b, c = CAL){
  if (!c || !c.any) return b - a;
  let n = 0;
  if (b >= a) { for (let d = a; d < b && n < 5000; d++) if (isWorkDay(d, c)) n++; return n; }
  for (let d = b; d < a && n > -5000; d++) if (isWorkDay(d, c)) n--; return n;
}
const WEEKDAYS = [1,2,3,4,5,6,0];
const dayName = d => new Date(Date.UTC(2024, 0, 7 + d)).toLocaleDateString(LOC(), {weekday:"short", timeZone:"UTC"}); // 2024-01-07 was a Sunday
function workDaysCard(){
  const P = S.project, wk = new Set((P.weekend||[]).map(Number)), hol = (P.holidays||[]).slice().sort();
  return `<div class="card"><h2>Working days</h2><p class="cap">Untick the days your team does not work. Task durations then count working days only, and the Gantt chart skips weekends and holidays.</p>
    <div class="daypick">${WEEKDAYS.map(d => `<label class="notr"><input type="checkbox" data-workday="${d}" ${wk.has(d)?"":"checked"}> ${esc(dayName(d))}</label>`).join("")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px">
      <div class="field" style="margin:0"><label class="lbl" for="holIn">Holiday</label><input id="holIn" type="date"></div>
      <button class="btn" data-hol-add type="button">+ Add holiday</button></div>
    ${hol.length ? `<div class="chips-row">${hol.map(h => `<span class="chip notr">${esc(fmt(d2n(h)))} <button type="button" data-hol-del="${esc(h)}" aria-label="Remove" title="Remove">✕</button></span>`).join("")}</div>` : ""}
  </div>`;
}

/* ---------- budget ---------- */
const BUDGET_CATS = ["People and labour","Materials and equipment","External services","Travel and other","Contingency"];
const BUDGET_SPLIT = [50,20,15,5,10];
function parseMoney(str){
  const s = String(str || "");
  const m = /(\d[\d,]*(?:\.\d+)?)\s*(k|m|million|lakh|lakhs|crore|crores)?(?![a-z])/i.exec(s); if (!m) return null;
  let n = parseFloat(m[1].replace(/,/g, "")); if (!isFinite(n)) return null;
  const u = (m[2] || "").toLowerCase();
  n *= u === "k" ? 1e3 : (u === "m" || u === "million") ? 1e6 : u.startsWith("lakh") ? 1e5 : u.startsWith("crore") ? 1e7 : 1;
  const cur = (/\b[A-Z]{3}\b|[$€£₹]|\b(?:rs|inr|usd|aed|sar|eur|gbp|qar|kwd|omr)\b/i.exec(s.replace(m[0], "")) || [""])[0].toUpperCase().replace(/^RS$/, "INR");
  return {n, cur};
}
const money = (n, cur) => (cur ? cur + " " : "") + Math.round(n || 0).toLocaleString(LOC() || "en");
function budgetInfo(st = S){
  const tot = parseMoney(st.project && st.project.budget), cur = tot ? tot.cur : "", total = tot ? tot.n : 0;
  const plan = st.budgetPlan || {}, costs = st.costs || [];
  const cats = BUDGET_CATS.map((c, i) => {
    const planned = plan[c] != null && plan[c] !== "" ? +plan[c] || 0 : total * BUDGET_SPLIT[i] / 100;
    const spent = costs.filter(x => (x.category || BUDGET_CATS[0]) === c).reduce((a, x) => a + (+x.amount || 0), 0);
    return {c, planned, spent, custom: plan[c] != null && plan[c] !== ""};
  });
  const spent = cats.reduce((a, x) => a + x.spent, 0);
  return {total, cur, cats, spent, left: total - spent, pct: total ? Math.round(spent / total * 100) : 0, has: total > 0 || costs.length > 0};
}
function budgetWarnings(b, st){
  const w = [];
  if (b.total && b.spent > b.total) w.push(tl("Over budget by {v}.", {v:money(b.spent - b.total, b.cur)}));
  else if (b.total && b.pct > st.overall + 10) w.push(tl("Spending ({a}%) is ahead of progress ({b}%).", {a:b.pct, b:st.overall}));
  for (const x of b.cats) if (x.planned > 0 && x.spent > x.planned) w.push(tl("{c} is over its plan by {v}.", {c:tl(x.c), v:money(x.spent - x.planned, b.cur)}));
  return w;
}
function chartBudget(b){
  const W = 760, LW = 190, RH = 46, top = 10, H = top + b.cats.length * RH + 10, PW = W - LW - 120;
  const max = Math.max(1, ...b.cats.map(x => Math.max(x.planned, x.spent)));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned and spent by category">`;
  b.cats.forEach((x, i) => {
    const y = top + i * RH, pw = PW * x.planned / max, sw = PW * x.spent / max, over = x.planned > 0 && x.spent > x.planned;
    s += `<text x="${LW - 10}" y="${y + 22}" font-size="12" text-anchor="end">${esc(tl(x.c))}</text>`;
    s += `<rect x="${LW}" y="${y + 6}" width="${Math.max(1, pw)}" height="14" rx="3" fill="var(--s1-soft)" data-tip="${esc(tl(x.c) + "|" + tl("Planned") + ": " + money(x.planned, b.cur))}"/>`;
    s += `<rect x="${LW}" y="${y + 22}" width="${Math.max(1, sw)}" height="14" rx="3" fill="${over ? "var(--crit)" : "var(--s1)"}" data-tip="${esc(tl(x.c) + "|" + tl("Spent") + ": " + money(x.spent, b.cur))}"/>`;
    s += `<text x="${LW + Math.max(pw, sw) + 8}" y="${y + 26}" font-size="11" fill="var(--fg-2)">${esc(money(x.spent, ""))} / ${esc(money(x.planned, ""))}</text>`;
  });
  return s + `</svg>`;
}
function viewBudget(){
  const sched = schedule(), st = stats(sched), b = budgetInfo(), warn = budgetWarnings(b, st), costs = S.costs || [];
  const rows = costs.map((x, i) => `<tr>
    <td style="width:150px"><input aria-label="Date" type="date" data-cost="${i}" data-cf="date" value="${esc(x.date || "")}"></td>
    <td style="min-width:170px"><select aria-label="Category" data-cost="${i}" data-cf="category">${BUDGET_CATS.map(c => `<option value="${c}" ${c === (x.category || BUDGET_CATS[0]) ? "selected" : ""}>${c}</option>`).join("")}</select></td>
    <td style="min-width:200px"><input aria-label="Item" data-cost="${i}" data-cf="item" value="${esc(x.item || "")}" placeholder="e.g. Cement delivery"></td>
    <td style="width:140px"><input aria-label="Amount" type="number" min="0" step="any" class="num" data-cost="${i}" data-cf="amount" value="${esc(x.amount ?? "")}"></td>
    <td style="width:44px"><button class="btn" data-cost-del="${i}" type="button" aria-label="Remove" title="Remove">✕</button></td></tr>`).join("");
  const plan = b.cats.map(x => { const used = x.planned ? Math.round(x.spent / x.planned * 100) : 0;
    return `<tr><td>${esc(x.c)}</td><td style="width:150px"><input aria-label="Planned" type="number" min="0" step="any" class="num" data-bplan="${esc(x.c)}" value="${Math.round(x.planned)}"></td>
      <td class="num mono">${esc(money(x.spent, ""))}</td><td class="num mono" style="color:${x.planned - x.spent < 0 ? "var(--crit)" : "inherit"}">${esc(money(x.planned - x.spent, ""))}</td>
      <td class="num mono" style="color:${used > 100 ? "var(--crit)" : "inherit"}">${used}%</td></tr>`; }).join("");
  return header("Budget", "Record what the project spends. PRISM compares it with the budget and with progress." + exampleNote(),

    + (b.total ? "" : `<div class="warn-line">⚠ ${esc(tl("Set the project budget first, for example USD 50,000, in Project details or on Ask PRISM."))}</div>`)
    + warn.map(w => `<div class="warn-line notr" style="color:var(--crit)">⚠ ${esc(w)}</div>`).join("")
    + (() => { const all = allTime(), h = all.reduce((a, e) => a + (+e.hours || 0), 0), c = timeCost(all); return h ? `<div class="warn-line notr" style="color:var(--fg-2)">⏱ ${esc(tl("Time logged: {h}, worth {v} at team hourly rates (see Timesheet).", {h:fmtH(h), v:money(c, b.cur)}))}</div>` : ""; })()
    + `<div class="kpis">
        <div class="kpi"><div class="lbl">Budget</div><div class="v notr" style="font-size:19px;padding-block:3px">${esc(b.total ? money(b.total, b.cur) : "–")}</div><div class="d">${esc(S.project.budget || "")}</div></div>
        <div class="kpi"><div class="lbl">Spent</div><div class="v notr" style="font-size:19px;padding-block:3px;color:${b.total && b.spent > b.total ? "var(--crit)" : "var(--fg)"}">${esc(money(b.spent, b.cur))}</div><div class="d">${b.pct}% of budget</div></div>
        <div class="kpi"><div class="lbl">Remaining</div><div class="v notr" style="font-size:19px;padding-block:3px;color:${b.left < 0 ? "var(--crit)" : "var(--fg)"}">${esc(money(b.left, b.cur))}</div><div class="d">${costs.length} expenses</div></div>
        <div class="kpi"><div class="lbl">Spent vs progress</div><div class="v">${b.pct}% · ${st.overall}%</div><div class="d">Spent · work done</div></div>
      </div>
      <div class="grid2">
        <div class="card chart"><h2>Planned and spent by category</h2><p class="cap">Light bar = planned. Dark bar = spent (red when over plan).</p>${chartBudget(b)}</div>
        <div class="card" style="padding:0;overflow:hidden"><div style="padding:12px 14px"><h2>Budget plan</h2><p class="cap" style="margin:0">Planned amount per category. PRISM splits the budget for you; change any amount.</p></div>
          <div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>Category</th><th>Planned</th><th>Spent</th><th>Remaining</th><th>Used</th></tr></thead><tbody>${plan}</tbody></table></div></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden;margin-top:16px"><div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h2>Expenses</h2><p class="cap" style="margin:0">One row per payment or invoice.</p></div><button class="btn primary" data-cost-add type="button">+ Add expense</button></div>
        ${costs.length ? `<div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>Date</th><th>Category</th><th>Item</th><th>Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="cap" style="padding:0 14px 14px">No expenses yet.</p>`}
      </div>`;
}

/* ---------- risk register ---------- */
const RISK_STATUS = ["Open","Watching","Closed"];
const riskScore = r => (+r.likelihood || 1) * (+r.impact || 1);
const riskLevel = n => n >= 15 ? "High" : n >= 8 ? "Medium" : "Low";
const riskColor = n => n >= 15 ? "var(--crit)" : n >= 8 ? "var(--warn)" : "var(--good)";
function nextRiskId(){ let n = 1; const ids = new Set((S.risks || []).map(r => r.id)); while (ids.has("R" + n)) n++; return "R" + n; }
function heatMap(risks){
  const open = risks.filter(r => r.status !== "Closed");
  let h = `<div class="heat" role="img" aria-label="Risk heat map"><div class="heat-y">Likelihood</div><div class="heat-grid">`;
  for (let L = 5; L >= 1; L--) {
    h += `<div class="heat-lbl">${L}</div>`;
    for (let I = 1; I <= 5; I++) { const ids = open.filter(r => (+r.likelihood || 1) === L && (+r.impact || 1) === I).map(r => r.id);
      h += `<div class="heat-cell" style="background:color-mix(in srgb, ${riskColor(L * I)} ${ids.length ? 55 : 16}%, var(--surface))" title="${L} × ${I} = ${L * I}">${esc(ids.join(" "))}</div>`; }
  }
  h += `<div></div>${[1,2,3,4,5].map(i => `<div class="heat-lbl">${i}</div>`).join("")}</div><div class="heat-x">Impact</div></div>`;
  return h;
}
function viewRisks(){
  const risks = S.risks || [], open = risks.filter(r => r.status !== "Closed");
  const cnt = lv => open.filter(r => riskLevel(riskScore(r)) === lv).length;
  const sel = (i, f, v, opts) => `<select aria-label="${{likelihood:"Likelihood", impact:"Impact", status:"Status"}[f] || f}" data-risk="${i}" data-rf="${f}">${opts.map(o => `<option value="${o}" ${String(o) === String(v) ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  const rows = risks.map((r, i) => { const sc = riskScore(r); return `<tr>
    <td class="mono">${esc(r.id)}</td>
    <td style="min-width:220px"><input aria-label="Risk" data-risk="${i}" data-rf="title" value="${esc(r.title || "")}" placeholder="What could go wrong?"></td>
    <td style="width:70px">${sel(i, "likelihood", r.likelihood || 3, [1,2,3,4,5])}</td>
    <td style="width:70px">${sel(i, "impact", r.impact || 3, [1,2,3,4,5])}</td>
    <td><span class="pill" style="color:${riskColor(sc)};font-weight:700">${sc} · ${riskLevel(sc)}</span></td>
    <td style="min-width:120px"><input aria-label="Owner" list="teamNames" data-risk="${i}" data-rf="owner" value="${esc(r.owner || "")}"></td>
    <td style="min-width:220px"><input aria-label="Mitigation" data-risk="${i}" data-rf="mitigation" value="${esc(r.mitigation || "")}" placeholder="What will we do about it?"></td>
    <td style="width:120px">${sel(i, "status", r.status || "Open", RISK_STATUS)}</td>
    <td style="width:44px"><button class="btn" data-risk-del="${i}" type="button" aria-label="Remove" title="Remove">✕</button></td></tr>`; }).join("");
  return teamDatalist() + header("Risk register", "Everything that could delay the project or raise its cost, how likely and how serious it is, and what you will do about it." + exampleNote(),

const SYNC_SKIP = ["chat", "example", "shareId", "shareRev", "shareBase"];
const syncOn = () => !!(window.PRISM_AI && window.PRISM_AI.sync);
const shareData = st => { const o = {}; for (const k of Object.keys(st)) if (!SYNC_SKIP.includes(k)) o[k] = st[k]; return JSON.parse(JSON.stringify(o)); };
const J = v => JSON.stringify(v);
// Three-way merge: keeps your changes and your teammates' changes; where both changed the same value, yours wins.
function merge3(b, l, s){
  if (J(l) === J(b)) return s;
  if (J(s) === J(b)) return l;
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  if (isObj(b) && isObj(l) && isObj(s)) { const out = {}; for (const k of new Set([...Object.keys(b), ...Object.keys(l), ...Object.keys(s)])) { const v = merge3(b[k], l[k], s[k]); if (v !== undefined) out[k] = v; } return out; }
  const keyed = a => Array.isArray(a) && a.every(x => x && typeof x === "object" && (x.id || x.name));
  if (keyed(b) && keyed(l) && keyed(s)) {
    const key = x => x.id || x.name, mb = new Map(b.map(x => [key(x), x])), ml = new Map(l.map(x => [key(x), x])), out = [], seen = new Set();
    for (const x of s) { const k = key(x); seen.add(k); if (mb.has(k) && !ml.has(k)) continue; out.push(ml.has(k) ? merge3(mb.get(k), ml.get(k), x) : x); }
    for (const x of l) { const k = key(x); if (!seen.has(k) && !mb.has(k)) out.push(x); }
    return out;
  }
  return l;
}
function applyShared(st, data){ for (const k of Object.keys(st)) if (!SYNC_SKIP.includes(k) && !(k in data)) delete st[k]; Object.assign(st, JSON.parse(J(data))); }
const accessCode = () => { try { return localStorage.getItem("prism.accessCode") || ""; } catch(e) { return ""; } };

  if (r.status === 401 && !retried) { const c = window.prompt(tl("Enter the PRISM access code:")); if (c) { try { localStorage.setItem("prism.accessCode", c.trim()); } catch(e) {} return syncFetch(method, id, body, q, true); } }
  return r;
}
let syncState = "", pushT = null, pushing = false, pendingRender = false;
function setSync(s){ syncState = s; const el = $("#syncState"); if (el) { el.textContent = tl({ok:"Up to date", saving:"Saving…", error:"Offline: changes will sync later", "":""}[s] || ""); el.style.color = s === "error" ? "var(--crit)" : "var(--fg-3)"; } }

async function pushNow(){
  const st = S; if (!st.shareId) return;

      if (r.ok) { const j = await r.json(); st.shareRev = j.rev; st.shareBase = data; save(true, true); setSync("ok"); return; }
      if (r.status === 409) { const cur = await r.json(); data = merge3(st.shareBase || {}, data, cur.data || {}); applyShared(st, data); st.shareRev = cur.rev; st.shareBase = cur.data; if (st === S) softRender(); continue; }
      throw new Error("HTTP " + r.status);

addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = $("#installBtn"); if (b) b.hidden = false; });
addEventListener("appinstalled", () => { installEvt = null; const b = $("#installBtn"); if (b) b.hidden = true; toast(tl("PRISM is installed. Open it from your Start menu, dock or home screen.")); });

/* ---------- activity log ---------- */
function logAct(k, v){
  S.activity = S.activity || [];
  S.activity.push({id:"A" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), t:new Date().toISOString(), by:getMe() || "", k, v:v || {}});
  if (S.activity.length > 300) S.activity = S.activity.slice(-300);
}
function activityCard(st = S, n = 12){
  const list = (st.activity || []).slice(-n).reverse();
  const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(LOC(), {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };
  return `<div class="card" style="margin-top:16px"><h2>Recent activity</h2><p class="cap">Who changed what in ${esc(st.project.name)}. Sign in so your name appears here.</p>
    ${list.length ? `<ul class="act">${list.map(a => `<li><span class="mono">${esc(when(a.t))}</span><b class="notr">${esc(a.by || tl("Someone"))}</b><span class="notr">${esc(tl(a.k, a.v))}</span></li>`).join("")}</ul>` : `<p class="cap" style="margin:0">Nothing yet.</p>`}</div>`;
}

/* ---------- sign-in for team members ---------- */
const hash53 = (str, seed = 7) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
const pinHash = pin => { S.salt = S.salt || Math.random().toString(36).slice(2, 10); return hash53(S.salt + ":" + String(pin).trim()); };
const projKey = () => S.shareId || W.current;
const authMap = () => { try { return JSON.parse(localStorage.getItem("prism.auth") || "{}"); } catch(e) { return {}; } };
function setAuth(name){ const a = authMap(); if (name) a[projKey()] = name; else delete a[projKey()]; try { localStorage.setItem("prism.auth", JSON.stringify(a)); } catch(e) {} }
const members = () => (S.team || []).filter(m => m.name && m.name.trim());
function signedIn(){ const n = authMap()[projKey()]; return n && members().some(m => m.name === n) ? n : ""; }
const needLogin = () => !!(S.project.requireLogin && members().length && !signedIn());
let siName = "", backView = "assistant";
function viewSignIn(){
  const ms = members(); if (!ms.some(m => m.name === siName)) siName = ms[0] ? ms[0].name : "";
  const m = ms.find(x => x.name === siName) || {};
  return header("Sign in", esc(S.project.name), "")
    + `<div class="card" style="max-width:460px"><h2>Who are you?</h2><p class="cap">${S.project.requireLogin ? "This project asks team members to sign in. Your name is shown on the changes you make." : "Sign in so your name is shown on the changes you make and My tasks opens with your tasks."}</p>
      <div class="field"><label class="lbl" for="siName">Team member</label><select id="siName" data-si-name class="notr">${ms.map(x => `<option value="${esc(x.name)}" ${x.name === siName ? "selected" : ""}>${esc(x.name)}${x.role ? " · " + esc(x.role) : ""}</option>`).join("")}</select></div>
      <div class="field"><label class="lbl" for="siPin">${m.pin ? "Your PIN" : "Choose a PIN (optional)"}</label><input id="siPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="${m.pin ? "PIN" : "e.g. 4 digits"}"></div>
      <p class="cap">${m.pin ? "Forgot your PIN? Ask the project manager to reset it on Ask PRISM." : "With a PIN, nobody else can sign in with your name. Leave it empty to skip."}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-si-go type="button">Sign in</button>${S.project.requireLogin ? "" : `<button class="btn" data-si-cancel type="button">Cancel</button>`}</div>
      <p class="note" style="margin:12px 0 0">This is a simple team sign-in, not a bank-grade password. Anyone with the project file or link can still read the project.</p></div>`;
}
function doSignIn(){
  const m = members().find(x => x.name === siName); if (!m) return;
  const pin = ($("#siPin") || {}).value || "";
  if (m.pin) { if (pinHash(pin) !== m.pin) { toast(tl("Wrong PIN.")); return; } }
  else if (pin.trim()) { if (!/^\S{4,12}$/.test(pin.trim())) { toast(tl("Use 4 to 12 characters for the PIN.")); return; } m.pin = pinHash(pin); }
  setAuth(m.name); setMe(m.name); logAct("signed in"); save();
  toast(tl("Signed in as {name}.", {name:m.name}));
  view = backView === "signin" ? "assistant" : backView; renderNav(); render(); renderMeBox(); checkNotify(true);
}
function renderMeBox(){
  const box = $("#meBox"); if (!box) return;
  if (!members().length) { box.innerHTML = ""; return; }
  const n = signedIn();
  box.innerHTML = n ? `<div class="mebox"><span class="notr">👤 <b>${esc(n)}</b></span><button class="btn sm ghost" id="signOut" type="button">Sign out</button></div>`
    : `<button class="btn sm" id="signInBtn" type="button">👤 Sign in</button>`;
  translateDOM(box);
}
function startSignIn(){ if (view !== "signin") backView = view; view = "signin"; siName = getMe(); renderNav(); render(); setTimeout(() => $("#siPin")?.focus(), 30); }

/* ---------- task details: notes, attachments, time, baseline and actual dates ---------- */
const HPD = 8; // working hours in one day
let openTask = null;
const taskIdx = id => S.tasks.findIndex(t => t.id === id);
const hoursOf = t => (t.time || []).reduce((a, e) => a + (+e.hours || 0), 0);
const fmtH = h => (Math.round(h * 100) / 100).toLocaleString(LOC() || "en") + " h";
const timerGet = () => { try { return JSON.parse(localStorage.getItem("prism.timer") || "null"); } catch(e) { return null; } };
const timerSet = v => { try { v ? localStorage.setItem("prism.timer", JSON.stringify(v)) : localStorage.removeItem("prism.timer"); } catch(e) {} };
const elapsed = ms => { const m = Math.floor(ms / 60000); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };
function timerBtn(t){
  const tm = timerGet(), on = tm && tm.pid === projKey() && tm.id === t.id;
  return `<button class="btn sm ${on ? "primary" : ""}" data-timer="${esc(t.id)}" type="button">${on ? `⏹ ${tl("Stop")} <span class="mono" data-timer-clock="${tm.start}">${elapsed(Date.now() - tm.start)}</span>` : "⏱ " + tl("Start timer")}</button>`;
}
function toggleTimer(id){
  const tm = timerGet(), t = S.tasks.find(x => x.id === id); if (!t) return;
  if (tm && tm.pid === projKey() && tm.id === id) {
    const h = Math.max(0.25, Math.round((Date.now() - tm.start) / 900000) / 4);
    t.time = t.time || []; t.time.push({id:"H" + Date.now().toString(36), date:n2d(TODAY), who:tm.who || getMe() || t.owner || "", hours:h, note:tl("Timer")});
    timerSet(null); logAct("logged {h} on {id}", {h:fmtH(h), id}); S.example = false; save(); render(); toast(tl("Logged {h} on {id}.", {h:fmtH(h), id}));
  } else {
    if (tm) { toast(tl("Stop the timer on {id} first.", {id:tm.id})); return; }
    timerSet({pid:projKey(), id, start:Date.now(), who:getMe() || t.owner || ""}); render();
  }
}
setInterval(() => { document.querySelectorAll("[data-timer-clock]").forEach(el => el.textContent = elapsed(Date.now() - +el.dataset.timerClock)); }, 20000);
function baselineOf(t){ const b = S.baseline && S.baseline.tasks && S.baseline.tasks[t.id]; return b ? {s:d2n(b.s), f:d2n(b.f)} : null; }
function saveBaseline(){
  const {R} = schedule(), tasks = {};
  for (const t of S.tasks) { const r = R.get(t.id); if (r) tasks[t.id] = {s:n2d(r.es), f:n2d(r.milestone ? r.es : r.ef)}; }
  S.baseline = {at:n2d(TODAY), tasks}; logAct("saved the baseline"); S.example = false; save(); render();
  toast(tl("Baseline saved. The Gantt chart now shows planned vs current dates."));
}
function taskDrawer(){
  const i = taskIdx(openTask); if (i < 0) { openTask = null; return ""; }
  const t = S.tasks[i], r = schedule().R.get(t.id) || {}, b = baselineOf(t), fin = r.es != null ? (r.milestone ? r.es : r.ef) : null;
  const varD = b && fin != null ? workBetween(b.f, fin) : null;
  const files = t.files || [], time = (t.time || []).slice().sort((a, c) => String(c.date).localeCompare(String(a.date)));
  const plannedH = (+t.dur || 0) * HPD, logged = hoursOf(t);
  const ppl = people();
  return `<div class="drawer-bg" data-close-task></div><aside class="drawer" role="dialog" aria-label="Task details">
    <div class="drawer-h"><div><span class="mono" style="color:var(--fg-3)">${esc(t.id)}</span><h2 class="notr" style="margin:2px 0 0">${esc(t.name)}</h2></div><button class="btn sm ghost" data-close-task type="button" aria-label="Close" title="Close">✕</button></div>
    <div class="dgrid">
      <div><span class="lbl">Owner</span><b class="notr">${esc(t.owner || "–")}</b></div>
      <div><span class="lbl">Status</span>${pill(t.status)}</div>
      <div><span class="lbl">Progress</span><b>${+t.progress || 0}%</b></div>
      <div><span class="lbl">Planned</span><b class="notr">${r.es != null ? esc(fmtShort(r.es) + " → " + fmtShort(fin)) : "–"}</b></div>
      <div><span class="lbl">Baseline</span><b class="notr">${b ? esc(fmtShort(b.s) + " → " + fmtShort(b.f)) : "–"}</b>${varD ? `<span class="notr" style="color:${varD > 0 ? "var(--crit)" : "var(--good)"};font-size:12px"> ${esc(varD > 0 ? tl("{n} days late", {n:varD}) : tl("{n} days early", {n:-varD}))}</span>` : ""}</div>
      <div><span class="lbl">Hours</span><b class="notr">${esc(fmtH(logged))}</b> <span class="note">/ ${esc(fmtH(plannedH))}</span></div>
    </div>
    <div class="fields" style="margin-top:12px"><div class="field"><label class="lbl" for="tdAS">Actual start</label><input id="tdAS" type="date" data-tdf="actualStart" data-ti="${i}" value="${esc(t.actualStart || "")}"></div>
      <div class="field"><label class="lbl" for="tdAF">Actual finish</label><input id="tdAF" type="date" data-tdf="actualFinish" data-ti="${i}" value="${esc(t.actualFinish || "")}"></div></div>
    <p class="note" style="margin-top:-4px">PRISM fills these in when the task starts and when it is marked Done. You can correct them.</p>
    <div class="field"><label class="lbl" for="tdNotes">Notes</label><textarea id="tdNotes" data-tdf="notes" data-ti="${i}" rows="3" placeholder="Decisions, blockers, links to discuss…">${esc(t.notes || "")}</textarea></div>
    <h3 class="dsec">Attachments</h3>
    ${files.length ? `<ul class="files">${files.map(f => `<li><span>${f.url ? "🔗" : "📎"}</span>${f.url ? `<a class="notr" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.name || f.url)}</a>` : `<button class="linkbtn notr" data-att-dl="${esc(f.id)}" type="button">${esc(f.name)}</button><span class="note">${esc(Math.round((f.size || 0) / 1024) + " KB")}</span>`}<span class="note notr">${esc(f.by || "")}</span><button class="btn sm ghost" data-att-del="${esc(f.id)}" type="button" aria-label="Remove" title="Remove">✕</button></li>`).join("")}</ul>` : `<p class="cap">No attachments yet.</p>`}
    <div class="att-add"><input id="attUrl" type="url" placeholder="Paste a link (Google Drive, OneDrive, Figma…)" aria-label="Link"><button class="btn sm" data-att-link type="button">+ Add link</button>
      <label class="btn sm" for="attFile">📎 Attach file</label><input id="attFile" type="file" data-att-file hidden></div>
    <p class="note">Files up to 500 KB are stored inside the project. For bigger files, add a link to Drive or OneDrive.</p>
    <h3 class="dsec">Time log</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">${timerBtn(t)}<span class="note">${esc(tl("{a} of {b} planned", {a:fmtH(logged), b:fmtH(plannedH)}))}</span></div>
    <div class="time-add"><input id="tmDate" type="date" value="${n2d(TODAY)}" aria-label="Date"><select id="tmWho" aria-label="Person" class="notr">${ppl.map(p => `<option ${p === (getMe() || t.owner) ? "selected" : ""}>${esc(p)}</option>`).join("")}</select><input id="tmHours" type="number" min="0.25" step="0.25" placeholder="Hours" aria-label="Hours" class="num"><input id="tmNote" placeholder="What did you do?" aria-label="Note"><button class="btn sm primary" data-time-add type="button">+ Log time</button></div>
    ${time.length ? `<table class="t" style="margin-top:8px"><thead><tr><th>Date</th><th>Person</th><th>Hours</th><th>Note</th><th></th></tr></thead><tbody>${time.map(e => `<tr><td class="mono">${esc(fmtShort(d2n(e.date) ?? TODAY))}</td><td class="notr">${esc(e.who || "")}</td><td class="num mono">${esc(String(e.hours))}</td><td class="notr">${esc(e.note || "")}</td><td><button class="btn sm ghost" data-time-del="${esc(t.id)}:${esc(e.id)}" type="button" aria-label="Remove" title="Remove">✕</button></td></tr>`).join("")}</tbody></table>` : ""}
  </aside>`;
}
const openBtn = t => `<button class="linkbtn mono" data-open-task="${esc(t.id)}" type="button" title="Open task details">${esc(t.id)}</button>`;
function readFileAsDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
async function attachFile(f){
  const t = S.tasks[taskIdx(openTask)]; if (!t || !f) return;
  if (f.size > 500 * 1024) { toast(tl("That file is bigger than 500 KB. Upload it to Drive or OneDrive and add the link instead.")); return; }
  const data = await readFileAsDataURL(f);
  t.files = t.files || []; t.files.push({id:"F" + Date.now().toString(36), name:f.name, size:f.size, type:f.type, data, by:getMe() || "", at:n2d(TODAY)});
  logAct("attached {f} to {id}", {f:f.name, id:t.id}); S.example = false; save(); render();
}
async function downloadAtt(id){
  const t = S.tasks[taskIdx(openTask)], f = t && (t.files || []).find(x => x.id === id); if (!f) return;
  const blob = await (await fetch(f.data)).blob(); await saveFile(f.name, blob);
}
// actual start/finish follow the status
function trackActual(t){
  if (!t.actualStart && (+t.progress > 0 || t.status === "In progress" || t.status === "Done")) t.actualStart = n2d(TODAY);
  if (t.status === "Done" || +t.progress >= 100) { if (!t.actualFinish) t.actualFinish = n2d(TODAY); }
  else t.actualFinish = "";
  if (t.status === "Not started" && !(+t.progress > 0)) t.actualStart = "";
}

/* ---------- timesheet ---------- */
let tsWeek = null;
const weekStart = n => n - ((new Date(n * DAY).getUTCDay() + 6) % 7);
function allTime(){ const out = []; S.tasks.forEach((t, i) => (t.time || []).forEach(e => out.push({...e, task:t, ti:i, n:d2n(e.date)}))); return out; }
const rateOf = name => { const m = (S.team || []).find(x => x.name === name); return m ? (parseMoney(m.rate) || {n:0}).n : 0; };
function timeCost(entries){ return entries.reduce((a, e) => a + (+e.hours || 0) * rateOf(e.who), 0); }
function viewTimesheet(){
  if (tsWeek == null) tsWeek = weekStart(TODAY);
  const all = allTime(), days = [0,1,2,3,4,5,6].map(k => tsWeek + k), wk = all.filter(e => e.n >= tsWeek && e.n < tsWeek + 7);
  const ppl = [...new Set([...people(), ...all.map(e => e.who)].filter(Boolean))];
  const cur = budgetInfo().cur, total = all.reduce((a, e) => a + (+e.hours || 0), 0), wkTotal = wk.reduce((a, e) => a + (+e.hours || 0), 0);
  const cell = (p, n) => { const h = wk.filter(e => e.who === p && e.n === n).reduce((a, e) => a + (+e.hours || 0), 0); return h ? `<b>${h}</b>` : `<span style="color:var(--fg-3)">·</span>`; };
  const pRows = ppl.map(p => { const h = wk.filter(e => e.who === p).reduce((a, e) => a + (+e.hours || 0), 0), r = rateOf(p);
    return `<tr><td class="notr">${esc(p)}</td>${days.map(n => `<td class="num mono">${cell(p, n)}</td>`).join("")}<td class="num mono"><b>${h}</b></td><td class="num mono notr">${r ? esc(money(h * r, cur)) : "–"}</td></tr>`; }).join("");
  const tRows = S.tasks.filter(t => hoursOf(t) > 0 || t.status !== "Done").map(t => { const lg = hoursOf(t), pl = (+t.dur || 0) * HPD, pc = pl ? Math.round(lg / pl * 100) : 0;
    return `<tr><td>${openBtn(t)}</td><td class="notr">${esc(t.name)}</td><td class="notr">${esc(t.owner || "")}</td><td class="num mono">${pl}</td><td class="num mono">${Math.round(lg * 100) / 100}</td><td class="num mono" style="color:${pc > 100 ? "var(--crit)" : "inherit"}">${pc}%</td><td>${timerBtn(t)}</td></tr>`; }).join("");
  const eRows = wk.sort((a, b) => a.n - b.n).map(e => `<tr><td class="mono">${esc(fmtShort(e.n))}</td><td class="notr">${esc(e.who || "")}</td><td>${openBtn(e.task)} <span class="notr">${esc(e.task.name)}</span></td><td class="num mono">${esc(String(e.hours))}</td><td class="notr">${esc(e.note || "")}</td><td><button class="btn sm ghost" data-time-del="${esc(e.task.id)}:${esc(e.id)}" type="button" aria-label="Remove" title="Remove">✕</button></td></tr>`).join("");
  return header("Timesheet", "Hours logged on each task, per person and per week. Log time from any task (click its ID) or start a timer below." + exampleNote(), `<button class="btn" data-export="xlsx" type="button">Download Excel</button>`)
    + `<div class="kpis">
        <div class="kpi"><div class="lbl">This week</div><div class="v">${Math.round(wkTotal * 100) / 100}</div><div class="d">hours</div></div>
        <div class="kpi"><div class="lbl">All time</div><div class="v">${Math.round(total * 100) / 100}</div><div class="d">${esc(tl("{n} h planned", {n:S.tasks.reduce((a, t) => a + (+t.dur || 0) * HPD, 0)}))}</div></div>
        <div class="kpi"><div class="lbl">Labour cost logged</div><div class="v notr" style="font-size:19px;padding-block:3px">${esc(money(timeCost(all), cur))}</div><div class="d">Hours × hourly rate</div></div>
        <div class="kpi"><div class="lbl">People logging</div><div class="v">${new Set(all.map(e => e.who).filter(Boolean)).size}</div><div class="d">${esc(tl("of {n}", {n:ppl.length}))}</div></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden"><div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h2>Week of <span class="notr">${esc(fmt(tsWeek))}</span></h2><p class="cap" style="margin:0">Hours per person per day. Set hourly rates on Ask PRISM to see the cost.</p></div>
        <span class="seg"><button class="btn" data-ts-week="-7" type="button" aria-label="Previous week">‹</button><button class="btn" data-ts-week="0" type="button">This week</button><button class="btn" data-ts-week="7" type="button" aria-label="Next week">›</button></span></div>
        <div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>Person</th>${days.map(n => `<th class="num notr">${esc(new Date(n * DAY).toLocaleDateString(LOC(), {weekday:"short", day:"numeric", timeZone:"UTC"}))}</th>`).join("")}<th class="num">Total</th><th class="num">Cost</th></tr></thead><tbody>${pRows || `<tr><td colspan="10" class="cap">Add team members on Ask PRISM first.</td></tr>`}</tbody></table></div></div>
      <div class="card" style="padding:0;overflow:hidden;margin-top:16px"><div style="padding:12px 14px"><h2>Time per task</h2><p class="cap" style="margin:0">Planned hours = days × ${HPD}. Red when a task has used more hours than planned.</p></div>
        <div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>ID</th><th>Task</th><th>Owner</th><th class="num">Planned h</th><th class="num">Logged h</th><th class="num">Used</th><th>Timer</th></tr></thead><tbody>${tRows}</tbody></table></div></div>
      <div class="card" style="padding:0;overflow:hidden;margin-top:16px"><div style="padding:12px 14px"><h2>Entries this week</h2></div>
        ${eRows ? `<div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>Date</th><th>Person</th><th>Task</th><th class="num">Hours</th><th>Note</th><th></th></tr></thead><tbody>${eRows}</tbody></table></div>` : `<p class="cap" style="padding:0 14px 14px">No time logged this week.</p>`}</div>`;
}

/* ---------- reminders (WhatsApp, email, browser notification) ---------- */
let showRem = false;
function dueSoon(st = S, days = 3){
  return withProject(st, () => { const {R} = schedule(); return S.tasks.map(t => ({t, r:R.get(t.id) || {}})).filter(x => x.t.status !== "Done" && x.r.es != null && (x.r.overdue || (x.r.milestone ? x.r.es : x.r.ef) <= TODAY + days)); });
}
function reminderText(name, items){
  const lines = items.map(({t, r}) => `- ${t.id} ${t.name}: ${tl("due {d}", {d:fmtShort(r.milestone ? r.es : r.ef)})}${r.overdue ? " (" + tl("overdue") + ")" : ""}, ${+t.progress || 0}%`);
  return tl("Hi {name}, a reminder from PRISM for {project}:", {name, project:S.project.name}) + "\n" + lines.join("\n") + "\n" + tl("Please update your progress in PRISM.") + (S.shareId && syncOn() ? "\n" + shareLink(S.shareId) : "");
}
function remindersCard(){
  const items = dueSoon(), by = new Map();
  for (const x of items) { const k = x.t.owner || ""; if (!by.has(k)) by.set(k, []); by.get(k).push(x); }
  const rows = [...by.entries()].map(([name, list]) => {
    const m = (S.team || []).find(x => x.name === name) || {}, txt = reminderText(name || tl("team"), list);
    const phone = String(m.phone || "").replace(/[^\d]/g, "");
    return `<div class="rem"><div><b class="notr">${esc(name || tl("Unassigned"))}</b> <span class="note">${esc(list.map(x => x.t.id).join(", "))}</span><pre class="rem-txt notr">${esc(txt)}</pre></div>

திக் கட்டத்தில் தேவைகள் மாறுதல்", "d.sw.risk.1": "தற்போதைய அமைப்புகளுடன் ஒருங்கிணைப்பு திட்டமிட்டதை விட அதிக நேரம் எடுத்தல்", "d.sw.risk.2": "நேரலைத் தொடக்கத்திற்குப் பிறகு பயனர்கள் குறைவாக ஏற்றுக்கொள்ளுதல்", "d.sw.mit.0": "வடிவமைப்பு ஒப்புதலுக்குப் பின் வரம்பை நிலைப்படுத்தி, மாற்றங்களை மாற்றக் கட்டுப்பாட்டின் மூலம் செய்தல்", "d.sw.mit.1": "மாதிரித் தரவுடன் ஒருங்கிணைப்புகளை முன்கூட்டியே சோதித்து இடைமுக ஒப்பந்தங்களை ஏற்றல்", "d.sw.mit.2": "முக்கியப் பயனர்களைச் சோதனையில் ஈடுபடுத்தி, நேரலைக்கு முன் பயிற்சி அளித்தல்", "d.sw.asm.0": "தேவைப் பட்டறைகள் மற்றும் சோதனைக்கு முக்கியப் பயனர்கள் கிடைக்கின்றனர்", "d.sw.asm.1": "தற்போதைய அமைப்புகள் மற்றும் சோதனைத் தரவுக்கான அணுகல் சரியான நேரத்தில் வழங்கப்படும்", "d.sw.arch.0": "ஊழியர்கள் மற்றும் மேலாளர்கள் பயன்படுத்தும் வலை மற்றும் மொபைல் முன்புலம்", "d.sw.arch.1": "வணிக தர்க்கம் மற்றும் REST API கொண்ட பயன்பாட்டுச் சேவையகம்", "d.sw.arch.2": "இரவுநேரக் காப்புப்பிரதியுடன் அனைத்துப் பதிவுகளுக்குமான தொடர்புசார் தரவுத்தளம்", "d.sw.arch.3": "மின்னஞ்சல், கட்டணங்கள் மற்றும் தற்போதைய அமைப்புகளுக்கான ஒருங்கிணைப்பு அடுக்கு", "d.sw.stack.0": "முன்புலம்: மொபைலுக்கு ஏற்ற React வலைப் பயன்பாடு", "d.sw.stack.1": "பின்புலம்: Node.js அல்லது Java REST சேவைகள்", "d.sw.stack.2": "தரவுத்தளம்: PostgreSQL", "d.sw.stack.3": "ஹோஸ்டிங்: கிளவுட் (AWS, Azure அல்லது அதுபோன்றது) [confirm]", "d.sw.fr.0": "பயனர்கள் தங்கள் சொந்தக் கணக்கு மற்றும் பங்குடன் உள்நுழைகின்றனர்", "d.sw.fr.1": "முக்கியப் பதிவுகளை உருவாக்குதல், பார்த்தல், புதுப்பித்தல் மற்றும் தேடுதல்", "d.sw.fr.2": "Excel மற்றும் PDF ஏற்றுமதியுடன் டாஷ்போர்டுகளும் அறிக்கைகளும்", "d.sw.fr.3": "முக்கிய நிகழ்வுகள் மற்றும் ஒப்புதல்களுக்கு மின்னஞ்சல் அறிவிப்புகள்", "d.sw.nfr.0": "95% கோரிக்கைகளுக்குப் பக்கங்கள் 2 விநாடிகளுக்குள் ஏறுதல்", "d.sw.nfr.1": "அலுவல் நேரத்தில் 99.5% கிடைப்புத்தன்மை", "d.sw.nfr.2": "குறைந்தது 500 ஒரே நேரப் பயனர்களுக்கு ஆதரவு [confirm]", "d.sw.data.0": "பயனர் (பெயர், பங்கு, தொடர்பு, நிலை)", "d.sw.data.1": "முக்கியப் பதிவு (ID, வகை, நிலை, பொறுப்பாளர், தேதிகள்)", "d.sw.data.2": "தணிக்கைப் பதி திட்டமிட்ட தேதிக்குள் கட்டுமானத்தை முடித்துக் கட்டடத்தை ஒப்படைத்தல்", "d.con.obj.1": "பெரிய குறைபாடுகள் இன்றி அனைத்து சட்டப்பூர்வ ஆய்வுகளிலும் தேர்ச்சி பெறுதல்", "d.con.obj.2": "ஒப்புதல் பெற்ற பட்ஜெட் மற்றும் இருப்பு நிதிக்குள் செலவை வைத்தல்", "d.con.obj.3": "தளத்தில் பணி இழப்பு ஏற்படுத்தும் விபத்துகள் பூஜ்ஜியம்", "d.con.out.0": "தளவாடங்கள் மற்றும் நகர்த்தக்கூடிய உபகரணங்கள்", "d.con.out.1": "தள எல்லைக்கு வெளியே நிலவடிவமைப்பு", "d.con.del.0": "முடிக்கப்பட்ட கட்டட அமைப்பும் சேவைகளும்", "d.con.del.1": "கட்டப்பட்டபடியான வரைபடங்கள் மற்றும் இயக்கக் கையேடுகள்", "d.con.del.2": "நிறைவுச் சான்றிதழ் மற்றும் உத்தரவாதங்கள்", "d.con.acc.0": "குறைபாட்டுப் பட்டியல் மூடப்பட்டு உரிமையாளர் ஒப்புதல்", "d.con.acc.1": "வரைபடங்கள் கட்டப்பட்ட பணியுடன் பொருந்துகின்றன, கையேடுகள் ஒப்படைக்கப்பட்டன", "d.con.acc.2": "அதிகாரியால் சான்றிதழ் வழங்கப்பட்டது", "d.con.risk.0": "அனுமதி ஒப்புதல் தாமதமாதல்", "d.con.risk.1": "பொருள் விலைகள் அல்லது விநியோக நேரம் அதிகரித்தல்", "d.con.risk.2": "மோசமான வானிலையால் தளப் பணி நின்றுவிடுதல்", "d.con.mit.0": "முழுமையான விண்ணப்பங்களை முன்கூட்டியே சமர்ப்பித்து வாரந்தோறும் பின்தொடர்தல்", "d.con.mit.1": "விநியோகஸ்தர்களுடன் விலைகளை நிர்ணயித்து நீண்ட காலம் எடுக்கும் பொருட்களை முன்கூட்டியே ஆர்டர் செய்தல்", "d.con.mit.2": "வானிலை சார்ந்த பணிகளை வறண்ட மாதங்களில் திட்டமிட்டு அட்டவணையில் இடைவெளி வைத்தல்", "d.con.asm.0": "தளம் சட்டப் பிரச்சினைகள் இல்லாதது மற்றும் அணுகக்கூடியது", "d.con.asm.1": "மண் நிலைமைகள் ஆய்வு முடிவுகளுடன் பொருந்துகின்றன", "d.con.arch.0": "மண் அறிக்கையின்படி வடிவமைக்கப்பட்ட வலுவூட்டப்பட்ட கான்கிரீட் அடித்தளம்", "d.con.arch.1": "தளப் பலகைகளுடன் கூடிய கட்டமைப்புச் சட்டகம் (கான்கிரீட் அல்லது எஃகு)", "d.con.arch.2": "கட்டட உறை: சுவர்கள், கூரை மற்றும் முகப்பு", "d.con.arch.3": "கட்டடச் சேவைகள்: மின்சாரம், குழாய், HVAC மற்றும் தீ பாதுகாப்பு", "d.con.stack.0": "கட்டமைப்பு: வடிவமைப்பின்படி தரமுள்ள வலுவூட்டப்பட்ட கான்கிரீட்", "d.con.stack.1": "உறை: பிளாக் சுவர்கள், வெப்பக்காப்புக் கூரை, கண்ணாடி", "d.con.stack.2": "சேவைகள்: மின்சாரம், குழாய், HVAC, தீ எச்சரிக்கை", "d.con.stack.3": "கருவிகள்: CAD/BIM வரைபடங்கள், தள நாட்குறிப்பு, ஆய்வுச் சரிபார்ப்புப் பட்டியல்கள்", "d.con.fr.0": "ஒப்புதல் பெற்ற வரைபடங்களின்படி தளப் பரப்பும் அறை அமைப்பும்", "d.con.fr.1": "குறிப்பிட்ட சுமைகளுக்காக வடிவமைக்கப்பட்ட கட்டமைப்பு", "d.con.fr.2": "ஒவ்வொரு அலகுக்கும் நீர், மின்சாரம் மற்றும் வடிகால் இணைப்புகள்", "d.con.fr.3": "விதிமுறைப்படி அவசர வழிகள், எச்சரிக்கைகள் மற்றும் அணுகல் வசதிகள்", "d.con.nfr.0": "கட்டமைப்புக்கு 50 ஆண்டு வடிவமைப்பு ஆயுள்", "d.con.nfr.1": "உள்ளூர் கட்டட விதிகள் மற்றும் பாதுகாப்பு விதிகளுக்கு இணக்கம்", "d.con.nfr.2": "ஆற்றல் சேமிக்கும் விளக்குகள் மற்றும் வெப்பக்காப்பு", "d.con.data.0": "வரைபடப் பதிவேடு (எண், திருத்தம், நிலை)", "d.con.data.1": "பொருள் ஒப்புதல்கள் மற்றும் சோதனைச் சான்றிதழ்கள்", "d.con.data.2": "ஆய்வு மற்றும் குறைபாட்டுப் பதிவுகள்", "d.con.api.0": "பயன்பாட்டு இணைப்புகள்: மின்சாரம், நீர், வடிகால்", "d.con.api.1": "சிவில், MEP மற்றும் முடிப்பு ஒப்பந்ததாரர்களுக்கு இடையிலான ஒருங்கிணைப்பு", "d.con.secr.0": "தள நுழைவுக் கட்டுப்பாடு மற்றும் பார்வையாளர் பதிவு", "d.con.secr.1": "தினசரி பாதுகாப்பு விளக்கம் மற்றும் அனைத்துத் தொழிலாளர்களுக்கும் PPE", "d.con.secr.2": "தளத்தில் தீ பாதுகாப்பு மற்றும் அவசரகாலத் திட்டம்", "d.con.test.0": "ஒவ்வொரு ஊற்றுக்கும் கான்கிரீட் கன சோதனைகள்", "d.con.test.1": "குழாய்களுக்கு அழுத்தச் சோதனை, வயரிங்கிற்குக் காப்புச் சோதனை", "d.con.test.2": "அதிகாரியின் இறுதி ஆய்வு", "d.con.dep.0": "தளம் அல்லது தொகுதி வாரியாகக் கட்டம் கட்டமாக ஒப்படைப்பு [confirm]", "d.con.dep.1": "ஒப்படைப்புக்கு முன் கட்டடச் சேவைகளை இயக்கித் தொடங்குதல்", "d.con.dep.2": "12 மாதக் குறைபாட்டுப் பொறுப்புக் காலம்", "d.con.gl.0": "MEP: இயந்திர, மின் மற்றும் குழாய்ப் பணிகள்", "d.con.gl.1": "குறைபாட்டுப் பட்டியல்: ஒப்படைப்புக்கு முன் சரிசெய்ய வேண்டிய சிறு குறைபாடுகள்", "d.con.gl.2": "கட்டப்பட்டபடியான வரைபடங்கள்: முடிந்த பணியுடன் பொருந்தப் புதுப்பிக்கப்பட்ட வரைபடங்கள்", "d.evt.tasks.0": "இலக்குகள், பட்ஜெட் மற்றும் பார்வையாளர்களை வரையறுத்தல்", "d.evt.tasks.1": "இடத் தேர்வு மற்றும் முன்பதிவு", "d.evt.tasks.2": "பேச்சாளர்கள், கலைஞர்கள் மற்றும் ந n.acc.0": "வெற்றி அளவுகோல்களின்படி ஆதரவாளர் ஏற்றுக்கொண்டார்", "d.gen.acc.1": "மதிப்பாய்வு செய்து கோப்பில் சேர்க்கப்பட்டது", "d.gen.acc.2": "ஒப்படைப்பு கையொப்பமிடப்பட்டது", "d.gen.risk.0": "திட்டத்தின்போது வரம்பு விரிவடைதல்", "d.gen.risk.1": "முக்கிய நபர்கள் கிடைக்காமை", "d.gen.risk.2": "விநியோகஸ்தர்கள் தாமதமாக வழங்குதல்", "d.gen.mit.0": "ஒவ்வொரு புதிய கோரிக்கைக்கும் மாற்றக் கட்டுப்பாட்டைப் பயன்படுத்துதல்", "d.gen.mit.1": "கிடைப்பை முன்கூட்டியே ஒப்புக்கொண்டு மாற்று நபர்களை நியமித்தல்", "d.gen.mit.2": "ஒப்பந்தங்களில் விநியோகத் தேதிகளை நிர்ணயித்து வாரந்தோறும் பின்தொடர்தல்", "d.gen.asm.0": "முடிவுகள் ஒரு வாரத்திற்குள் எடுக்கப்படுகின்றன", "d.gen.asm.1": "செயலாக்கம் தொடங்கும் முன் பட்ஜெட் ஒப்புதல் பெறுகிறது", "d.gen.arch.0": "தீர்வின் முக்கியக் கூறுகள் அல்லது பணித் தொகுப்புகள்", "d.gen.arch.1": "ஒவ்வொரு பகுதியையும் வழங்கும் நபர்களும் குழுக்களும்", "d.gen.arch.2": "அதை வழங்கவும் இயக்கவும் பயன்படும் செயல்முறைகளும் கருவிகளும்", "d.gen.stack.0": "கருவிகள்: குழுவுடன் ஒப்புக்கொண்டபடி [confirm]", "d.gen.stack.1": "ஒத்துழைப்பு: பகிரப்பட்ட இயக்ககம், அரட்டை மற்றும் வாராந்திரக் கூட்டங்கள்", "d.gen.stack.2": "கண்காணிப்பு: PRISM கேண்ட் விளக்கப்படம் மற்றும் பணி கண்காணிப்பு", "d.gen.fr.0": "ஒவ்வொரு பணித் தொகுப்பையும் ஒப்புக்கொண்ட தரத்தில் வழங்குதல்", "d.gen.fr.1": "ஆதரவாளருக்கு வாரந்தோறும் முன்னேற்றம் தெரிவித்தல்", "d.gen.fr.2": "முடிவுகளையும் மாற்றங்களையும் பதிவு செய்தல்", "d.gen.nfr.0": "ஏற்புக்கு முன் தர மதிப்பாய்வு", "d.gen.nfr.1": "நிறுவனக் கொள்கைகள் மற்றும் விதிமுறைகளைப் பின்பற்றுதல்", "d.gen.nfr.2": "PRISM-இல் தகவல்கள் புதுப்பித்த நிலையில் வைக்கப்படுகின்றன", "d.gen.data.0": "பணித் திட்டம் மற்றும் நிலை", "d.gen.data.1": "முடிவுகள் மற்றும் மாற்றப் பதிவு", "d.gen.data.2": "ஆவணங்கள் மற்றும் ஒப்புதல்கள்", "d.gen.api.0": "குழுக்களுக்கு இடையிலான பணி ஒப்படைப்புகள்", "d.gen.api.1": "ஆதரவாளர் மற்றும் பங்குதாரர்களுக்கு அறிக்கையிடல்", "d.gen.secr.0": "திட்டக் கோப்புகளுக்கான அணுகல் குழுவுக்கு மட்டும்", "d.gen.secr.1": "உணர்திறன் தகவல்கள் தேவைப்படும்போது மட்டுமே பகிரப்படும்", "d.gen.secr.2": " function plan(prompt){

  const CAT = {"Software / IT":"sw", "Construction":"con", "Engineering":"eng", "Event":"evt", "Marketing":"mkt", "Research":"res"};

  const want = /report|تقرير|रिपोर्ट|அறிக்கை|റിപ്പോർട്ട്|rapport|informe/i.test(q) ? "report" : /technical|tech|تقني|फ़नी|तकनीकी|தொழில்நுட்ப|സാങ്കേതിക|technique|t[ée]cnic/i.test(q) ? "techdoc" : null;
  const f = want ? hits.filter(h => h[0] === want) : hits;

}
function wholeDoc(q){

async function chat(messages, opts){
  const tools = Object.fromEntries((opts.tools || []).map(t => [t.name, t]));
  const last = [...messages].reverse().find(m => m.role === "user" && typeof m.content === "string");
  const q = (last && last.content || "").trim();
  const sched = schedule(), st = stats(sched), R = id => sched.R.get(id) || {};
  const ids = [...new Set((q.toUpperCase().match(/\bT\d+\b/g) || []))];
  const task = id => S.tasks.find(t => t.id === id);
  const critL = S.tasks.filter(t => R(t.id).critical).map(t => t.id).join(" → ") || T("g.none");
  const fin = t => { const r = R(t.id); return r.milestone ? r.es : r.ef; };
  const call = async (name, input) => tools[name] ? tools[name].execute(input, {signal:new AbortController().signal}) : null;
  let m;

  // new project from a topic
  const npTopic = ids.length ? null : newProjTopic(q);
  if (npTopic) {
    const topic = npTopic;
    await call("start_new_project", {topic});

  }
  // add a task
  // add a team member: "Add team member Omar as Back-end developer"
  if (tools.add_team_member && /member|membre|miembro|عضو|सदस्य|உறுப்பினர்|അംഗ/i.test(q) && (KW.add.test(q) || /^\s*(?:new\s+)?(?:team\s+)?member/i.test(q))) {
    const nm = /(?:[Mm]ember|[Mm]embre|[Mm]iembro|عضو(?:اً|ا)?|सदस्य|உறுப்பினர்|അംഗ\S*)\s*[:،,]?\s*([^\s,،:]+(?:\s+[A-Z][\w'-]+)?)/.exec(q) || /\b([A-Z][\w'-]+)\b/.exec(q.replace(/^\S+/, ""));
    const rl = /(?:\bas\b|\bcomme\b|\bcomo\b|بصفة|كـ|बतौर|के रूप में)\s*([^,،.]+?)(?:\s+(?:in|dans|en|في|में)\s+(?:the\s+)?([^,،.]+?)(?:\s+team)?)?\s*$/i.exec(q) || /([^,،.]+?)\s+(?:ஆக|ആയി)(?:\s|$)/.exec(q);
    const name = nm && nm[1] && !/^(as|comme|como)$/i.test(nm[1]) ? nm[1].trim() : null;
    if (name) {
      const role = rl ? rl[1].trim() : "", group = rl && rl[2] ? rl[2].trim() : "";
      const r = await call("add_team_member", {name, role, group});
      return T("c.member", {name, role:role || "–", n:(r && r.tasksAssigned) || 0});
    }
  }
  if (KW.add.test(q) && /task|مهمة|कार्य|काम|பணி|ടാസ്ക്|ജോലി|tâche|t[aá]rea/i.test(q)) {
    let name = (/["'“”‘’«»]([^"'“”‘’«»]{2,80})["'“”‘’«»]/.exec(q) || [])[1];
    if (!name) { const mm = /(?:task|مهمة|कार्य|பணி|ടാസ്ക്|tâche|t[aá]rea)\s*(?:called|named)?\s*:?\s*(.+?)(?=\s+(?:for|to|by|after|with|owner|pour|apr[eè]s|para|despu[eé]s)\b|\s+(?:لـ|ل |بعد|के लिए|के बाद)|[,،]|$)/i.exec(q); name = mm && mm[1].replace(ADD_VERB, "").trim(); }
    if (!name) return T("c.addNeed");
    const owner = ((/(?:\bfor|\bto|\bowner|\bassign(?:ed)? to|لـ|\bpour|\bpara)\s+([A-Z\u0600-\u06FF\u0900-\u0DFF][\w\u0600-\u06FF\u0900-\u0DFF.-]*(?:\s[A-Z][\w.-]*)?)/.exec(q) || /(\S+)\s+(?:के लिए|க்கு|ന്|ക്ക്)(?:\s|$)/.exec(q) || [])[1] || "").trim();
    const days = +((/(\d+)\s*(?:days?|d\b|أيام|يوم|दिन|நாட்கள்|நாள்|ദിവസ|jours?|d[ií]as?)/i.exec(q) || [])[1] || 5);
    const preds = ids.filter(id => task(id));
    const pr = /high|urgent|important|عاجل|उच्च|உயர்|ഉയർന്ന|haute|alta/i.test(q) ? "High" : /low|منخفض|निम्न|குறைந்த|താഴ്ന്ന|basse|baja/i.test(q) ? "Low" : "Medium";
    const res = await call("add_task", {name:cap1(name), owner, durationDays:days, predecessors:preds, priority:pr});
    return T("c.added", {id:(res && res.id) || "", name:cap1(name), owner:owner ? T("c.addOwner", {owner}) : "", after:preds.length ? T("c.addAfter", {preds:joinL(preds)}) : "", days});
  }
  // update a task
  if (ids.length && task(ids[0]) && /mark|set|change|update|move|make|is now|done|complete|finished|progress|%|status|owner|assign|duration|days|priority|block|hold|risk|start|اجعل|غير|حدث|مكتمل|अपडेट|बदल|पूरा|மாற்று|முடிந்தது|മാറ്റ|പൂർത്തി|marque|termin|cambia|marca|completad|responsable|asign|assigne|attribue|مسؤول|عي[ّ]?ن|أسند|मालिक|ज़िम्मेदार|सौंप|பொறுப்பாளர்|ஒதுக்கு|ஆக்கு|ഉടമ|ചുമതല|നൽകുക|ആക്കുക|करो/i.test(q) && !KW.write.test(q)) {
    const id = ids[0], t = task(id), ch = {}, say = [];
    const pct = /(\d{1,3})\s*%/.exec(q);
    if (/\b(done|complete|completed|finished|close)\b|مكتمل|منتهي|पूरा|पूर्ण|முடிந்த|பூர்த்தி|പൂർത്തി|termin[ée]|fait|completad|hecho|terminad/i.test(q)) { ch.status = "Done"; ch.progress = 100; }
    else if (pct) { ch.progress = Math.min(100, +pct[1]); if (ch.progress >= 100) ch.status = "Done"; else if (t.status === "Not started" && ch.progress > 0) ch.status = "In progress"; }
    if (/block/i.test(q)) ch.status = "Blocked"; else if (/at risk/i.test(q)) ch.status = "At risk"; else if (/in progress|started|start/i.test(q) && !ch.status) ch.status = "In progress";
    const own = ownerIn(q); if (own) ch.owner = own;
    const dur = /(\d+)\s*(?:days?|أيام|दिन|நாட்கள்|ദിവസ|jours?|d[ií]as?)/i.exec(q); if (dur && /duration|days|take|يستغرق|अवधि|காலம்|ദൈർഘ്യ|durée|duraci/i.test(q)) ch.durationDays = +dur[1];
    if (/after|predecessor|depends|بعد|के बाद|பிறகு|ശേഷം|apr[eè]s|despu[eé]s/i.test(q) && ids.length > 1) ch.predecessors = ids.slice(1).filter(x => task(x));
    if (/priority|أولوية|प्राथमिकता|முன்னுரிமை|മുൻഗണന|priorit/i.test(q)) ch.priority = /high|عالية|उच्च|உயர்|ഉയർന്ന|haute|alta/i.test(q) ? "High" : /low|منخفضة|निम्न|குறைந்த|താഴ്ന്ന|basse|baja/i.test(q) ? "Low" : "Medium";
    if (Object.keys(ch).length) {
      await call("update_task", {id, ...ch});
      if (ch.status) say.push(T("c.chStatus", {v:ST(ch.status)})); if (ch.progress != null) say.push(T("c.chProgress", {v:ch.progress}));
      if (ch.owner) say.push(T("c.chOwner", {v:ch.owner})); if (ch.durationDays != null) say.push(T("c.chDur", {v:ch.durationDays}));
      if (ch.predecessors) say.push(T("c.chPreds", {v:joinL(ch.predecessors)})); if (ch.priority) say.push(T("c.chPrio", {v:ST(ch.priority)}));
      return T("c.updated", {id, name:t.name, changes:joinL(say)});
    }
  }
  // write document sections
  if (KW.write.test(q)) {
    const data = {topic:S.topic, ...contextPacket()};
    let targets = findSections(q);
    const whole = !targets.length || /all|whole|entire|full|complete|كل|كامل|पूरा|सभी|முழு|அனைத்து|മുഴുവൻ|tout|entier|todo|completo/i.test(q) ? wholeDoc(q) : null;
    if (whole) targets = TEMPLATES[whole].sections.filter(s => !s.auto && !(S.docs[whole].sections[s.k] || "").trim()).map(s => [whole, s.k]);
    if (whole && !targets.length) targets = TEMPLATES[whole].sections.filter(s => !s.auto).map(s => [whole, s.k]);
    if (targets.length) {
      for (const [doc, k] of targets) await call("write_doc_section", {doc, section:k, text:writeSection(doc, k, data)});
      const doc = targets[0][0];
      const names = targets.map(([d, k]) => ST(TEMPLATES[d].sections.find(s => s.k === k).h).replace(/^\d+\.\s*/, ""));
      return T("c.wrote", {list:names.length > 4 ? names.slice(0, 3).join(", ") + ` … (+${names.length - 3})` : joinL(names), doc:ST(TEMPLATES[doc].name)});
    }
  }
  // one task's details
  if (ids.length === 1 && task(ids[0])) {
    const t = task(ids[0]), r = R(t.id);
    return T("c.task", {id:t.id, name:t.name, owner:t.owner || "–", status:ST(t.status), pct:+t.progress || 0, s:fmtD(r.es), f:fmtD(fin(t)), slack:r.slack ?? 0, preds:joinL(t.preds) || T("g.none"), succ:joinL(r.succ || []) || T("g.none")});
  }
  if (ids.length && !task(ids[0])) return T("c.noTask", {id:ids[0]});
  if (KW.crit.test(q)) {
    const cr = S.tasks.filter(t => R(t.id).critical);
    return T("c.critHead", {crit:critL, end:fmtD(sched.end)}) + "\n" + cr.map(t => T("c.critItem", {id:t.id, name:t.name, s:fmtD(R(t.id).es), f:fmtD(fin(t)), owner:t.owner || "–"})).join("\n");
  }
  if (KW.risk.test(q)) {
    const late = S.tasks.filter(t => R(t.id).overdue || R(t.id).behind);
    if (!late.length) return T("c.riskNone", {crit:critL});
    return T("c.riskHead") + "\n" + late.map(t => { const r = R(t.id);
      return T("c.riskItem", {id:t.id, name:t.name, owner:t.owner || "–", pct:+t.progress || 0, exp:r.expected ?? 0, over:r.overdue ? T("c.over") : ""}) + "\n" + (r.critical ? T("c.actCrit") : T("c.actSlack", {slack:r.slack ?? 0})); }).join("\n");
  }
  if (KW.work.test(q)) {
    const by = {};
    for (const t of S.tasks) { if (!t.owner) continue; const o = by[t.owner] = by[t.owner] || {n:0, days:0, left:0, open:[]}; o.n++; o.days += +t.dur || 0; const l = Math.round((+t.dur || 0) * (100 - (+t.progress || 0)) / 100); o.left += l; if (l > 0) o.open.push(t); }

    let text = T("c.workHead") + "\n" + rows.map(([owner, o]) => T("c.workItem", {owner, n:o.n, days:o.days, left:o.left})).join("\n");
    if (rows.length > 1 && rows[0][1].left > rows[rows.length - 1][1].left * 2 && rows[0][1].open.length > 1) {

  }
  if (KW.finish.test(q)) return T("c.finish", {end:fmtD(sched.end), days:sched.end - TODAY});

  }

}

/* ---------- the sample-compatible interface ---------- */
async function sample(input, opts){
  opts = opts || {};
  const messages = typeof input === "string" ? [{role:"user", content:input}] : input;
  const text = await chat(messages, opts);
  if (text == null) return {text:null, truncated:false};
  if (opts.onText) opts.onText({text, delta:text});
  return {text, truncated:false};
}
sample.json = async (input) => {
  const prompt = typeof input === "string" ? input : (input[input.length - 1] || {}).content || "";
  await new Promise(r => setTimeout(r, 350)); // let the build status show each step
  if (prompt.includes("Plan a realistic project")) return plan(prompt);
  if (prompt.includes("keys are exactly:")) return drafts(prompt);
  if (prompt.includes("Suggest risks for this project")) return suggestRisks(prompt);
  throw {code:"unsupported", message:"The built-in engine cannot answer this request"};
};

/* ---------- rewrite an existing project in the current language ---------- */
let REV = null;
function relabel(v){
  if (!v) return null;
  if (!REV) { REV = new Map(); const ok = id => /^(d\.\w+\.(tasks\.\d+|client|sponsor)|role\.\w+)$/.test(id);
    const add = tr => { for (const id in tr) if (ok(id) && !REV.has(tr[id])) REV.set(tr[id], id); };
    add(FLAT); for (const l in (window.ENGINE_TR || {})) add(window.ENGINE_TR[l]); }
  const id = REV.get(String(v).trim()); if (!id) return null;
  const out = T(id); return out !== v ? out : null;
}
function relocalize(){
  const first = S.tasks[0] && S.tasks[0].name, oldDesc = S.project.description || "";
  for (const t of S.tasks) { const n = relabel(t.name); if (n) t.name = n; const o = relabel(t.owner); if (o) t.owner = o; }
  for (const f of ["client", "sponsor"]) { const n = relabel(S.project[f]); if (n) S.project[f] = n; }
  const data = {topic:S.topic, ...contextPacket()};
  if (first && oldDesc.includes(first) && S.tasks.length) { // a description PRISM wrote is written again
    const dom = domainOf((S.topic || "") + " " + (S.project.name || ""));
    S.project.description = T("g.descr", {name:S.project.name, what:T(`d.${dom}.what`), client:S.project.client, n:S.tasks.length, start:fmtD(S.project.start), end:fmtD(data.plannedFinish), first:S.tasks[0].name, last:S.tasks[S.tasks.length - 1].name});
  }
  for (const [k, tpl] of Object.entries(TEMPLATES)) for (const s of tpl.sections)
    if (!s.auto && S.docs[k] && String(S.docs[k].sections[s.k] || "").trim()) S.docs[k].sections[s.k] = writeSection(k, s.k, data);
  S.example = false;
}
window.PRISM_ENGINE = {sample, domainOf, plan, writeSection, relocalize, EN, FLAT};
